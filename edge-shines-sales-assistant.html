<title>Edge Shines Sales Assistant</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:wght@400;600;700&display=swap">
<style>
/* Layout: sticky navy header with search, sidebar nav, working canvas. Brand: navy + teal on cool white. */
:root{
  --hdr:#0e2240; --hdr-2:#18355f; --hdr-fg:#ffffff; --hdr-muted:#b9c7da;
  --bg:#f2f5f8; --surface:#ffffff; --surface-2:#f7f9fb; --line:#d6dee8; --fg:#0f1c2f; --muted:#55667c;
  --teal:#0b7f82; --teal-hover:#096b6d; --on-teal:#ffffff; --teal-soft:#e2f2f2; --teal-ink:#075d60;
  --warn:#8a5200; --warn-bg:#fff3dc; --bad:#b42318; --bad-bg:#fdeceb; --ok:#17703d; --ok-bg:#e4f3ea;
  --mark:#ffec99; --focus:#f2a900;
  --search-bg:#ffffff; --search-fg:#0f1c2f; --search-ph:#62748a; --search-line:#c9d3df; --search-btn:#e8edf3; --search-btn-fg:#25364d;
  --shadow:0 12px 32px rgba(8,20,40,.22);
  --f-display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --hdr:#07142a; --hdr-2:#11264a; --hdr-fg:#f2f6fb; --hdr-muted:#94a7c2;
  --bg:#0a1424; --surface:#101e34; --surface-2:#0d1a2e; --line:#22364f; --fg:#e6edf6; --muted:#9badc3;
  --teal:#38bcbe; --teal-hover:#56cfd1; --on-teal:#04202a; --teal-soft:#0e3238; --teal-ink:#7fdadb;
  --warn:#f2b65a; --warn-bg:#36270b; --bad:#ff8b80; --bad-bg:#3b1513; --ok:#71d39c; --ok-bg:#0e2f1f;
  --mark:#5b4a00; --focus:#f2b65a;
  --search-bg:#15284a; --search-fg:#eef3fa; --search-ph:#94a7c2; --search-line:#2c4468; --search-btn:#22385c; --search-btn-fg:#dbe5f2;
  --shadow:0 12px 32px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --hdr:#07142a; --hdr-2:#11264a; --hdr-fg:#f2f6fb; --hdr-muted:#94a7c2;
  --bg:#0a1424; --surface:#101e34; --surface-2:#0d1a2e; --line:#22364f; --fg:#e6edf6; --muted:#9badc3;
  --teal:#38bcbe; --teal-hover:#56cfd1; --on-teal:#04202a; --teal-soft:#0e3238; --teal-ink:#7fdadb;
  --warn:#f2b65a; --warn-bg:#36270b; --bad:#ff8b80; --bad-bg:#3b1513; --ok:#71d39c; --ok-bg:#0e2f1f;
  --mark:#5b4a00; --focus:#f2b65a;
  --search-bg:#15284a; --search-fg:#eef3fa; --search-ph:#94a7c2; --search-line:#2c4468; --search-btn:#22385c; --search-btn-fg:#dbe5f2;
  --shadow:0 12px 32px rgba(0,0,0,.5); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:1rem;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--hdr)}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;line-height:1.15;text-wrap:balance}
h1{font-size:1.9rem;font-weight:700}
h2{font-size:1.45rem;font-weight:700}
h3{font-size:1.15rem;font-weight:600}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
mark{background:var(--mark);color:inherit;border-radius:2px;padding:0 1px}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--hdr);color:var(--hdr-fg);
  padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:grid;grid-template-columns:220px minmax(0,1fr) auto;gap:20px;align-items:center}
.brand{display:flex;flex-direction:column;gap:3px;cursor:pointer;background:none;border:0;padding:0;text-align:left;color:inherit}
.brand b{font-family:var(--f-display);font-size:1.45rem;letter-spacing:.08em;font-weight:700;line-height:1}
.brand b i{font-style:normal;color:var(--teal)}
.brand span{font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--hdr-muted)}
.search{position:relative;display:flex;align-items:center}
.search svg{position:absolute;left:16px;width:22px;height:22px;color:var(--search-ph);pointer-events:none}
.search input{width:100%;height:54px;border-radius:10px;border:2px solid transparent;background:var(--search-bg);color:var(--search-fg);
  font-size:1.12rem;padding:0 92px 0 50px}
.search input::-webkit-search-cancel-button{display:none}
.search input::placeholder{color:var(--search-ph)}
.search input:focus{border-color:var(--teal);outline:none}
.search .clear{position:absolute;right:10px;height:36px;padding:0 12px;border-radius:6px;border:0;background:var(--search-btn);color:var(--search-btn-fg);cursor:pointer;font-size:.9rem}
.search kbd{position:absolute;right:14px;font-family:var(--f-mono);font-size:.8rem;color:var(--search-ph);border:1px solid var(--search-line);border-radius:4px;padding:1px 7px}
.rep{display:flex;flex-direction:column;gap:3px;font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;color:var(--hdr-muted)}
.rep input{width:170px;height:36px;border-radius:6px;border:1px solid var(--hdr-2);background:var(--hdr-2);color:var(--hdr-fg);padding:0 10px;font-size:.95rem;letter-spacing:0;text-transform:none}
.rep input::placeholder{color:var(--hdr-muted)}

/* Search suggestions dropdown */
.sugg{position:absolute;left:0;right:0;top:calc(100% + 8px);background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:10px;
  box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:14px;max-height:min(70vh,560px);overflow:auto;z-index:40}
.sg{display:flex;flex-direction:column;gap:8px}
.srow{text-align:left;border:0;background:none;padding:8px 10px;border-radius:6px;cursor:pointer;font-size:1rem}
.srow:hover,.srow:focus-visible{background:var(--surface-2)}
.lnk{border:0;background:none;color:var(--teal-ink);font-weight:600;cursor:pointer;padding:0 4px;font-size:.85rem;text-transform:none;letter-spacing:0}

/* Shell */
.shell{display:grid;grid-template-columns:236px minmax(0,1fr);align-items:start;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hh,78px));max-height:calc(100vh - var(--hh,78px));overflow:auto;
  padding:16px 12px 24px 16px;display:flex;flex-direction:column;gap:4px;border-right:1px solid var(--line);min-height:calc(100vh - var(--hh,78px))}
.side .grp{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:14px 12px 4px}
.nav{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;padding:10px 12px;border-radius:7px;cursor:pointer;font-size:1rem;color:var(--fg)}
.nav:hover{background:var(--surface)}
.nav[aria-current="page"]{background:var(--teal);color:var(--on-teal);font-weight:600}
.side .prefs{padding:20px 12px 0;margin-top:auto}
.side .rep-side{display:none}
main{min-width:0;padding-block:24px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:20px;max-width:1280px}
@media (min-width:900px){main{padding-left:28px;padding-right:28px}}

.vhead{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px}
.vhead p{color:var(--muted);max-width:70ch;margin-top:4px}
.eyebrow{font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;color:var(--teal-ink);font-weight:700}

/* Generic blocks */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel > h3{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.stack{display:flex;flex-direction:column;gap:12px;min-width:0}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.src{font-family:var(--f-mono);font-size:.74rem;color:var(--muted);letter-spacing:.01em}
.secl{font-size:.76rem;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.74rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:3px 10px;max-width:100%}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.info{background:var(--teal-soft);color:var(--teal-ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:42px;border-radius:7px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;cursor:pointer;font-weight:600;font-size:.95rem;white-space:nowrap}
.btn:hover{border-color:var(--teal);color:var(--teal-ink)}
.btn.primary{background:var(--teal);border-color:var(--teal);color:var(--on-teal)}
.btn.primary:hover{background:var(--teal-hover);color:var(--on-teal)}
.btn.sm{min-height:36px;padding:5px 12px;font-size:.88rem}
.btn.copied{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.btn:disabled{opacity:.55;cursor:default}
.btn svg{width:16px;height:16px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;cursor:pointer;font-size:.95rem;text-align:left}
.chip.sm{padding:5px 12px;font-size:.86rem}
.chip:hover{border-color:var(--teal);color:var(--teal-ink)}
.chip[aria-pressed="true"]{background:var(--hdr);border-color:var(--hdr);color:var(--hdr-fg)}
.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%,30%{box-shadow:0 0 0 4px var(--focus)}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){.flash{animation:none;box-shadow:0 0 0 3px var(--focus)}}
.notice{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:8px;background:var(--warn-bg);color:var(--fg)}
.notice .ic{color:var(--warn);font-weight:800;font-family:var(--f-mono)}
.bignum{font-family:var(--f-display);font-size:2rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.phone-only{display:none}
.olist2{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px}

/* Say blocks: the words a rep reads aloud */
.say{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.say .lbl{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.say .lbl b{font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--teal-ink)}
.say q{quotes:none;font-size:1.14rem;line-height:1.55}
.say.big q{font-size:1.24rem}
.say .meta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.do{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;padding:10px 0;border-top:1px solid var(--line)}
.do:first-of-type{border-top:0}
.do .n{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);padding-top:3px;min-width:22px}
.do .t b{font-weight:600}
.rule{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:7px;background:var(--warn-bg);color:var(--fg)}
.rule .ic{color:var(--warn);font-weight:800;font-family:var(--f-mono)}
.okrule{background:var(--ok-bg)}
.okrule .ic{color:var(--ok)}
.fact{padding:10px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:3px}
.fact:first-child{border-top:0}
.fact b{font-weight:700}
.chk{display:flex;gap:10px;align-items:flex-start;padding:7px 0;cursor:pointer}
.chk input{width:20px;height:20px;margin-top:2px;accent-color:var(--teal);flex:none}

/* Home */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.tile .v{font-family:var(--f-display);font-size:1.7rem;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.tile .l{font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.tile .d{font-size:.9rem;color:var(--muted)}
.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.qbtn{display:flex;flex-direction:column;gap:4px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px 16px;cursor:pointer}
.qbtn:hover{border-color:var(--teal)}
.qbtn b{font-family:var(--f-display);font-size:1.2rem}
.qbtn span{color:var(--muted);font-size:.92rem}
.qbtn.lead{background:var(--hdr);color:var(--hdr-fg);border-color:var(--hdr)}
.qbtn.lead span{color:var(--hdr-muted)}

/* Search */
.res{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.res.best{border:2px solid var(--teal)}
.res.aipick{border:1.5px solid var(--teal)}
.res .hd{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.res h3{font-size:1.2rem}
.res .fld{display:grid;grid-template-columns:130px minmax(0,1fr);gap:4px 14px}
.res .fld > span:nth-child(odd){font-size:.76rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;padding-top:3px}
.res .main{font-size:1.1rem;line-height:1.55}
.res.best .main{font-size:1.2rem}
.res .ft{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.tp{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700;padding:3px 9px;border-radius:5px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
.tp.t-objection{background:var(--teal-soft);color:var(--teal-ink);border-color:transparent}
.tp.t-script{background:var(--hdr);color:var(--hdr-fg);border-color:transparent}
.tp.t-flag{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.aiask{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;justify-content:space-between;padding:14px 16px;border:1.5px dashed var(--teal);border-radius:var(--r);background:var(--teal-soft)}
.aiask .small{flex-basis:100%}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}

/* Call flow */
.flow{display:grid;grid-template-columns:290px minmax(0,1fr);gap:18px;align-items:start}
.steps{display:flex;flex-direction:column;gap:4px;position:sticky;top:calc(var(--hh,78px) + 16px)}
.stp{display:grid;grid-template-columns:34px minmax(0,1fr);gap:8px;align-items:center;text-align:left;border:1px solid transparent;background:none;border-radius:7px;padding:8px 10px;cursor:pointer;font-size:.98rem}
.stp:hover{background:var(--surface)}
.stp .num{font-family:var(--f-mono);font-size:.85rem;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line);background:var(--surface)}
.stp.done .num{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.stp[aria-current="step"]{background:var(--surface);border-color:var(--teal)}
.stp[aria-current="step"] .num{background:var(--teal);border-color:var(--teal);color:var(--on-teal)}
.stepbody{display:flex;flex-direction:column;gap:16px;min-width:0}
.stephead{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:flex-start}
.stephead h2{font-size:1.7rem}
.cols{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;align-items:start}

/* Objections */
.objs{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:18px;align-items:start}
.olist{display:flex;flex-direction:column;gap:6px}
.ogrp{font-size:.74rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:10px 2px 2px}
.ogrp:first-child{padding-top:0}
.ocard{display:flex;justify-content:space-between;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:11px 14px;cursor:pointer;font-size:1rem}
.ocard:hover{border-color:var(--teal)}
.ocard[aria-pressed="true"]{border:2px solid var(--teal);padding:10px 13px;background:var(--teal-soft)}
.ocard small{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.odetail{position:sticky;top:calc(var(--hh,78px) + 16px);max-height:calc(100vh - var(--hh,78px) - 32px);overflow:auto;border-radius:var(--r)}
.cust{font-family:var(--f-display);font-size:1.5rem;font-weight:600}
.stack > .filter{flex:none}
.filter{height:44px;border-radius:7px;border:1px solid var(--line);background:var(--surface);padding:0 14px;min-width:0;flex:1 1 220px;font-size:1rem}

/* Estimator */
.est{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:18px;align-items:start}
.tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:14px}
.tool{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.tool .th{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.tool .th h3{font-size:1.12rem}
.rate{font-family:var(--f-mono);font-size:.82rem;color:var(--teal-ink);font-weight:500}
.lines{display:flex;flex-direction:column;gap:6px}
.ln{display:grid;gap:6px;align-items:center}
.ln input,.ln select{height:42px;border-radius:6px;border:1px solid var(--line);background:var(--surface-2);padding:0 9px;min-width:0;width:100%;font-variant-numeric:tabular-nums}
.ln .x{width:34px;height:34px;border:0;background:none;color:var(--muted);cursor:pointer;border-radius:6px;font-size:1.2rem}
.ln .x:hover{background:var(--bad-bg);color:var(--bad)}
.ln.roof,.ln.stake{grid-template-columns:minmax(0,1fr) 96px 34px}
.ln.bush{grid-template-columns:minmax(0,1fr) 70px 70px 34px}
.ln.wreath{grid-template-columns:90px 60px minmax(0,1fr) 34px}
.ln.garland{grid-template-columns:minmax(0,1fr) 64px 86px 84px 34px}
.ln.labor{grid-template-columns:minmax(0,1fr) 100px 34px}
.ln.hd{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.sub{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-variant-numeric:tabular-nums;border-top:1px dashed var(--line);padding-top:8px}
.sub b{font-size:1.05rem}
.need{font-size:.85rem;color:var(--bad);font-weight:600}
.termseg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.termseg button{border:0;background:none;padding:10px 18px;cursor:pointer;font-weight:600;font-size:1rem;border-left:1px solid var(--line)}
.termseg button:first-child{border-left:0}
.termseg button[aria-pressed="true"]{background:var(--hdr);color:var(--hdr-fg)}
.termseg.sm button{padding:6px 12px;font-size:.88rem}
.summary{position:sticky;top:calc(var(--hh,78px) + 16px);max-height:calc(100vh - var(--hh,78px) - 32px);overflow:auto;display:flex;flex-direction:column;gap:12px;border-radius:var(--r)}
.tot{background:var(--hdr);color:var(--hdr-fg);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.tot .big{font-family:var(--f-display);font-size:2.6rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.tot .lbl{font-size:.74rem;letter-spacing:.12em;text-transform:uppercase;color:var(--hdr-muted);font-weight:700}
.tot .note{color:var(--hdr-muted)}
.tot .dep{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-variant-numeric:tabular-nums;border-top:1px solid var(--hdr-2);padding-top:8px;margin-top:4px}
.tot .dep span:nth-child(odd){color:var(--hdr-muted)}
.items{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;font-variant-numeric:tabular-nums;font-size:.95rem}
.items .r{text-align:right}
.cmp{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:.95rem}
.cmp td,.cmp th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right}
.cmp th:first-child,.cmp td:first-child{text-align:left}
.cmp tr.on td{font-weight:700;color:var(--teal-ink)}
.panel details{border-top:1px solid var(--line);padding-top:8px}
.panel details:first-child{border-top:0;padding-top:0}
summary{cursor:pointer;font-weight:600;padding:4px 0}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;width:100%;font-size:.93rem;min-width:560px}
.tbl th,.tbl td{text-align:left;vertical-align:top;padding:8px 10px;border-bottom:1px solid var(--line)}
.tbl th{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

/* Fill-in templates */
.fills{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.fills label{display:flex;flex-direction:column;gap:3px;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.fills input,.fills textarea{height:42px;border-radius:6px;border:1px solid var(--line);background:var(--surface-2);padding:0 10px;font-size:1rem;letter-spacing:0;text-transform:none;color:var(--fg);font-weight:400;width:100%}
.fills textarea{height:72px;padding:8px 10px;resize:vertical;line-height:1.4}
.fone{display:flex;flex-direction:column;gap:6px;min-width:0}
.ph{background:var(--warn-bg);color:var(--warn);border-radius:3px;padding:0 3px;font-weight:600}
.filled{background:var(--teal-soft);color:var(--teal-ink);border-radius:3px;padding:0 3px;font-weight:600}
.prompt{font-size:1rem;line-height:1.6;background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:14px 16px;white-space:pre-wrap}

/* FLYRA */
.wf{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.wfb{border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 14px;cursor:pointer;font-weight:700;font-family:var(--f-display);font-size:1.05rem;display:flex;gap:8px;align-items:center}

.wfb.done{border-color:var(--ok)}
.arrow{color:var(--muted);font-weight:700}
.fstep{display:grid;grid-template-columns:28px 44px minmax(0,1fr);gap:4px 12px;padding:12px 4px;border-top:1px solid var(--line);align-items:start}
.fstep.dim{opacity:.45}
.fstep input{width:22px;height:22px;accent-color:var(--teal);margin-top:2px}
.fstep .n{font-family:var(--f-mono);color:var(--muted);padding-top:2px}

.notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}

.pbsec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.pbsec > summary{list-style:none;display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;padding:14px 18px;cursor:pointer}

.pbsec[open] > summary::before{content:"−"}
.pbsec .tab{font-family:var(--f-display);font-size:1.25rem;font-weight:700}
.pbbody{padding:14px 18px 18px;display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line)}
.pbbody h4{font-size:.85rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:8px}

#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--hdr);color:var(--hdr-fg);padding:10px 18px;border-radius:8px;font-weight:600;z-index:50;box-shadow:0 6px 24px rgba(0,0,0,.25);max-width:calc(100vw - 32px)}

  .objs{grid-template-columns:minmax(0,1fr)}
  .odetail{position:static;order:-1;max-height:none;overflow:visible}
}
@media (max-width:760px){

  .ln.garland{grid-template-columns:minmax(0,1fr) 56px 76px 70px 30px}
}

ned service agreement.", "items": [{"topic": "Product type", "say": "Commercial-grade C9 LED Christmas lights on customized socket line. Use ‘C9 LED’ when the customer asks what type.", "check": "Bulb style available in stock", "row": 6}, {"topic": "Seasonal vs permanent", "say": "These are professionally installed seasonal holiday lights—not permanent, phone-controlled color-changing lighting.", "check": "Do not imply app control", "row": 7}, {"topic": "Colors", "say": "Customers can choose from available fixed colors or fixed multi-color patterns. Black and gray are not offered.", "check": "Confirm specific color availability", "row": 8}, {"topic": "Can colors change?", "say": "No. The installed bulb colors remain what the customer selects. Changing colors requires replacing/reworking bulbs rather than tapping an app.", "check": "Explain prior to selling", "row": 9}, {"topic": "Client supplies lights?", "say": "No. Edge Shines does not install homeowner-provided light strings or bulbs.", "check": "Company-supplied only", "row": 10}, {"topic": "Custom fit", "say": "We measure, custom-cut and splice socket line to the home's approved roofline so there aren't stray bulbs dangling past edges.", "check": "Exact installable footprint", "row": 11}, {"topic": "Spacing", "say": "Typical roofline presentation uses approximately 15-inch spacing unless the approved design specifies otherwise.", "check": "Confirm stock line spacing", "row": 12}, {"topic": "Roofline coverage", "say": "Follow installable gutters, roof peaks, gables, garage edges and other approved lines; don't add lines where there are no secure mounting options.", "check": "Access review", "row": 13}, {"topic": "Bushes and trees", "say": "Mini lights can wrap approved shrubs/trees; quote by strand or project using approved material quantities.", "check": "Count separately", "row": 14}, {"topic": "Ground lighting", "say": "Ground stakes can border an approved driveway or walkway; quote lengths separately.", "che agreement we offer.", "check": "Always 3 years", "row": 25}, {"topic": "Reason for multi-year", "say": "Most custom material and initial setup investment occurs in the first season, so later seasons are important for sustainable pricing.", "check": "Do not claim exact losses", "row": 26}, {"topic": "Early cancellation", "say": "Your typical policy uses a fee of 40% of that year's seasonal bill for applicable early cancellation, to offset custom materials. Agreement exceptions control.", "check": "Confirm actual signed terms", "row": 27}, {"topic": "Competitor comparison", "say": "Explain the full-service value and competitive pricing objectives, not unverified claims of being the cheapest.", "check": "No unsupported ranking", "row": 28}, {"topic": "Typical home price", "say": "Use around $1,000 per season as a general expectation setter—not a guaranteed minimum, maximum or fixed house quote.", "check": "Actual price by design", "row": 29}, {"topic": "Roof safety", "say": "Use approved attachment methods based on roof/siding material. Never promise staples, glue, magnets or no damage without reviewing conditions.", "check": "Escalate unusual roof materials", "row": 30}]}, "obj": {"sheet": "05 OBJECTIONS", "title": "OBJECTION FINDER  |  SELECT A QUESTION", "sub": "Choose an objection in B4 to bring its answer to the top. Full answer bank is below; adjust terms to the customer's signed agreement.", "items": [{"says": "I don't want a 3-year agreement", "answer": "I understand. We aim to offer competitive full-service pricing. In year one we buy the lights, custom-cut and splice everything to your home, and complete the initial setup—so that first season carries most of our material costs. The later seasons are how we make the multi-year service sustainable. We return each year to install, maintain, remove and store everything.", "next": "Would it help if I showed you the seasonal price for your home?", "row": 11}, {"says": "What if I cancel in the second year?", "answer": "For agreements with our standard early-cancellation clause, the fee is 40% of that year's seasonal bill. It helps recover the cost of materials already custom-fit to your home. I can show you the exact wording before you sign; any promotional exception in your signed agreement takes precedence.", "next": "Would you like me to send the specific cancellation section for review?", "row": 12}, {"says": "Why can't I do one year?", "answer": "Our program is built on a 3-year agreement because the first-year custom materials and installation are the largest investment. The 3-year agreement is what lets us keep the seasonal price at $6 a foot, and you only pay one season at a time.", "next": "Would it help to see the seasonal price for your home?", "row": 13}, {"says": "Is $1,000 the price for my house?", "answer": "That's the approximate price of an average seasonal home, not a universal quote. Your total depends on roofline footage, access, the design and any add-ons. I can measure the requested sections with you now.", "next": "Is roofline-only your priority?", "row": 14}, {"says": "It's too expensive", "answer": "I understand. We supply professional lights, custom-fit the lines, install, provide maintenance, then remove and store everything. We can simplify the design—often starting with the front roofline—to bring the total closer to your goal.", "next": "What total would you be more comfortable with?", "row": 15}, {"says": "Other companies are cheaper", "answer": "That may be true for a different scope. Our quote includes the custom-fit company-owned C9 lights, professional setup, seasonal upkeep, takedown and storage. Let's compare what's included rather than only the headline number.", "next": "Do you know whether their quote includes removal and storage?", "row": 16}, {"says": "What kind of lights are they?", "answer": "We use commercial-grade C9 LED holiday lights on custom-cut socket line, designed for a clean and uniform roofline.", "next": "Would you prefer warm white or another fixed color?", "row": 17}, {"says": "Can the lights change colors?", "answer": "The seasonal C9 lights we quote are fixed-color bulbs, not an app-controlled color-changing system. You can choose an approved single color or fixed multicolor layout when we design it.", "next": "Which fixed look do you prefer?", "row": 18}, {"says": "What colors can I choose?", "answer": "We can work with the available C9 colors and fixed patterns, other than black or gray. I'll confirm stock before promising an exact color combination.", "next": "Do you want classic warm white, multicolor or a specific pattern?", "row": 19}, {"says": "Will the lights hang over my roof?", "answer": "No loose extra bulbs are part of the plan. We custom-cut and splice the roofline runs to fit the approved edges and install them as neatly as the roof permits.", "next": "Can we focus on the visible front edges first?", "row": 20}, {"says": "Can you hang lights I already own?", "answer": "We don't install homeowner-provided lights. Using our own commercial-grade materials lets us custom-fit the layout and manage maintenance consistently.", "next": "Would you like a quote for our done-for-you service?", "row": 21}, {"says": "Who owns the lights after installation?", "answer": "Edge Shines retains ownership of the company-provided lights and related materials under our standard service agreement; we store them for upcoming seasons.", "next": "Would you like to review the service-inclusions section?", "row": 22}, {"says": "Do you store them for me?", "answer": "Yes. Seasonal removal and storage of our company-provided lighting are included in the standard full-service program.", "next": "Would you like the roofline taken down at the standard seasonal time?", "row": 23}, {"says": "What if a bulb goes out?", "answer": "Let us know and we'll address covered maintenance issues during the season under the agreement. Damage from third parties or equipment can have different treatment.", "next": "Can I confirm the best contact number for service?", "row": 24}, {"says": "Can I get roofline only?", "answer": "Absolutely. Roofline-only is a great clean design, and we can cover as much of the visible installable front roofline as you'd like within your budget.", "next": "Should I include the garage and front peaks?", "row": 25}, {"says": "Can you do the trees and bushes?", "answer": "Yes, we can quote minis on selected shrubs and trees as add-ons. We'll estimate the strand count separately from the roofline.", "next": "Which plants do you want included?", "row": 26}, {"says": "I need to ask my spouse", "answer": "Of course. I'd be happy to send the design and price so you're both looking at the same option, then we can answer any questions together.", "next": "When would both of you be available for five minutes?", "row": 27}, {"says": "I need to think about it", "answer": "Absolutely. Is the main thing you’re considering the total price, how the design looks, or the 3-year agreement? I want to send you the information that’s actually useful.", "next": "What would help you decide?", "row": 28}, {"says": "Just send me pricing", "answer": "Happy to. The accurate way is to confirm the property, the sections you'd like lit, and the seasonal agreement. I can often get you a number while we're speaking.", "next": "What's the full address?", "row": 29}, {"says": "I don't have time right now", "answer": "No problem. We only need a few minutes for the consultation. Let's choose a time that works so we can discuss exactly what you want.", "next": "Would later today or tomorrow be better?", "row": 30}, {"says": "Can you guarantee the exact mockup?", "answer": "The mockup shows the intended design, but actual lighting will follow installable roof edges and real conditions. We review it for accuracy before finalizing.", "next": "Which elements of the concept matter most to you?", "row": 31}, {"says": "Is this permanent lighting?", "answer": "No, it's professional seasonal Christmas lighting. We install it, provide agreed maintenance, then remove and store the lighting.", "next": "Are you looking specifically for seasonal decorating?", "row": 32}, {"says": "My roof is metal or aluminum", "answer": "We'd review the roof and approved attachment options before committing to a mounting method. We won't assume that magnets, glue, clips or staples are suitable.", "next": "Could you share a close-up photo of the roof edge?", "row": 33}, {"says": "Can you install this week?", "answer": "We'd love to help. I can check available installation dates once we confirm the scope and paperwork, but I don't want to promise a date that isn't reserved.", "next": "What is your ideal installation date?", "row": 34}, {"says": "Does the price include removal?", "answer": "Yes. Our standard full-service seasonal pricing includes installation, covered maintenance, removal and storage of our company-owned lighting.", "next": "Do you want me to show the full inclusions on the quote?", "row": 35}, {"says": "Can we change the design next year?", "answer": "We can discuss changes, though the 3-year price is built around the original custom-fitted design. New areas, colors or major revisions may require a revised quote.", "next": "What kind of change are you considering?", "row": 36}, {"says": "Are there cancellation fee exceptions?", "answer": "Some promotions may offer different terms. The only terms I can promise are those in your specific signed agreement; I'll check them before answering conclusively.", "next": "Can I review the agreement you're being offered?", "row": 37}, {"says": "Why is a deposit needed?", "answer": "We reserve labor and prepare custom-fit materials for your property. Our standard program uses a 50% deposit, with the balance generally due upon completed installation.", "next": "Would you like me to send the agreement and payment steps?", "row": 38}], "policy": "POLICY NOTE  •  Check signed cancellation terms, promotional exceptions, current rates and inventory; do not guarantee costs, dates or materials without verification."}, "mock": {"sheet": "06 AI MOCKUPS", "title": "AI MOCKUP SOP  |  ONLY 3 PROMPTS", "sub": "Attach a clear image of the customer's actual property. Copy the entire prompt from the appropriate cell; do not invent the building or lighting locations.", "steps": [{"step": "1  Select photo", "do": "Use the best clear front/street-facing home photo from the customer, Maps, Zillow or another legitimate property view. Check that it is the right property.", "rule": "Clear front roofline", "row": 6}, {"step": "2  Choose 1 of 3 prompts", "do": "Whole-property concept, maximum front roofline, or a specific revision. Replace bracketed items like [COLOR] before pasting.", "rule": "No extra prompts needed", "row": 7}, {"step": "3  Submit photo + prompt", "do": "Upload the property photo to the image AI and paste the selected template verbatim. If the tool supports marking exact edges, mark them first.", "rule": "Use source photo", "row": 8}, {"step": "4  Verify before sending", "do": "Compare original and result. Check roof edges, missing/extra lights, door/window changes, landscaping, bulb spacing, floating lines and unrealistic installation.", "rule": "Reject inaccurate mockups", "row": 9}, {"step": "5  Explain to customer", "do": "“Here's a design concept for your home. We’ll verify the actual installation areas and measurements before treating it as the final scope.”", "rule": "Not a measuring tool", "row": 10}], "prompts": [{"label": "PROMPT 1\nBEST POSSIBLE DESIGN", "text": "Edit the ATTACHED PHOTO of this exact property. Create the most attractive, high-impact, professionally installable Christmas lighting design realistically possible for the visible property. Use commercial-grade C9 LED holiday lights with a fixed [COLOR OR COLOR PATTERN] color scheme and visually even approximately 15-inch spacing on all suitable visible front gutters, front-facing roof peaks, gables, garage roof edges and connecting installable rooflines. Make the light runs neatly custom-cut and spliced to fit: no bulbs hanging beyond roof edges, floating bulbs or sagging lines. Add complementary mini lights on suitable front bushes and trees, and tasteful wreaths or garland ONLY where physically plausible, balanced and consistent with a premium full-property proposal. Do not invent architectural surfaces, unsafe mounting points, new windows, doors, bushes or trees. Change the scene to realistic nighttime with natural LED glow. Preserve the property's exact architecture, landscaping and camera angle. If a feature is unclear or inaccessible, leave it unlit rather than guessing.", "use": "Full-property concept\nShow premium options", "row": 14}, {"label": "PROMPT 2\nMAX ROOFLINE ONLY", "text": "Edit the ATTACHED PHOTO of this exact property. Install as MANY fixed [COLOR OR COLOR PATTERN] commercial-grade C9 LED Christmas lights as realistically possible on the VISIBLE, INSTALLABLE FRONT ROOFLINE ONLY. Follow every suitable front gutter, front-facing roof peak, gable, garage roof edge and connecting roofline to create maximum roofline coverage. Use visually even approximately 15-inch spacing. Custom-cut and splice the runs to fit precisely: NO extra bulbs hanging past roof edges, floating bulbs, or sagging lines. DO NOT add lights on siding, around windows or doors, bushes, trees, walkways, pillars, wreaths or garland. Make it nighttime with realistic glow. Preserve every architectural feature, landscaping element and the camera angle exactly as photographed. If a section is unclear or physically inaccessible, leave it out rather than inventing a surface.", "use": "Roofline-only quote\nNo landscaping", "row": 15}, {"label": "PROMPT 3\nREVISE EXISTING MOCKUP", "text": "Edit the ATTACHED CHRISTMAS LIGHT MOCKUP of this exact property. Make ONLY the following specific changes: [DESCRIBE EXACT CHANGES, e.g., remove lights from left bushes; add one 24-inch warm-white wreath with red bow over center window; keep roofline lights unchanged]. Follow any user-marked red lines or circles exactly. Preserve every existing light and decoration NOT explicitly mentioned, including current color, spacing, placement and glow. Do not add any new lights or decorations outside the requested changes. Keep the architecture, landscaping, perspective and nighttime lighting exactly the same. Make all remaining light runs neat, correctly attached and realistic. If a requested surface is unclear or physically inaccessible, leave it unchanged instead of inventing one.", "use": "Changes only\nNo redesign", "row": 16}], "final": "FINAL CHECK  •  Does the AI design match the customer's measured scope, fixed-color selection and the home's actual roofline? If not, correct it before sending."}, "flyra": {"sheet": "07 FLYRA SOP", "title": "FLYRA SOP  |  LEAD → CUSTOMER → SUBSCRIPTION", "sub": "This is the Edge Shines internal workflow requested for FLYRA. Use the equivalent current menu labels if the interface changes.", "steps": [{"n": "01", "action": "Open original lead", "detail": "Search by customer name or number; review latest call/text notes; don't create a duplicate.", "result": "Existing record", "row": 6}, {"n": "02", "action": "Confirm customer fields", "detail": "Full name, phone, email if available, address including city/ZIP, property notes, source, decision-maker.", "result": "Complete profile", "row": 7}, {"n": "03", "action": "Document scope", "detail": "Roofline sections, footage and reliability, C9 colors, add-ons, design image, 3-year agreement and anticipated installation date.", "result": "Ready to quote", "row": 8}, {"n": "04", "action": "CLICK: CONVERT TO CUSTOMER", "detail": "When a quote is required, click Convert to Customer on the lead record.", "result": "Customer created", "row": 9}, {"n": "05", "action": "CHOOSE: SUBSCRIPTION", "detail": "In the conversion workflow, choose Subscription for the recurring seasonal Christmas lighting service.", "result": "Subscription path", "row": 10}, {"n": "06", "action": "Verify conversion", "detail": "Confirm correct customer, property, 3-year plan length, seasonal price and subscription details; check for duplicates.", "result": "Correct records", "row": 11}, {"n": "07", "action": "Create estimate / quote", "detail": "Line-item approved roofline and add-ons, attach mockup if supported, review price, service inclusions and applicable taxes.", "result": "Draft quote", "row": 12}, {"n": "08", "action": "Send + present", "detail": "Send approved quote to customer, explain plan, color, scope, seasonal services and what happens next.", "result": "Quote sent", "row": 13}, {"n": "09", "action": "Update lead stage / record", "detail": "Use the appropriate current FLYRA status for design/quote sent or negotiating; record date and quoted amount.", "result": "Trackable stage", "row": 14}, {"n": "10", "action": "Set next action", "detail": "Assign named owner, exact next date/time, specific contact method and customer question to answer. Send recap text as needed.", "result": "No unowned opportunity", "row": 15}, {"n": "11", "action": "When accepted", "detail": "Send company-approved agreement and deposit request; verify signature/payment before confirming installation.", "result": "Agreement + payment", "row": 16}, {"n": "12", "action": "Confirm install booking", "detail": "After prerequisites are met, confirm agreed installation window in the scheduling system and notify customer.", "result": "Reserved installation", "row": 17}], "notes": ["Address & photos", "Decision-maker", "Fixed color / design areas", "Exact or estimated footage", "Approved seasonal price (3-year)", "Objections", "Quote sent", "Next action + owner"], "pipeline": {"before": "New Lead → Contact Attempted", "during": "Qualified → Design/Estimate Sent → Negotiating", "after": "Won after required approvals/payment; otherwise Lost + reason", "rbefore": "Always log attempt + time", "rduring": "Never leave quote without next action", "rafter": "Don't mark booked without actual date confirmation"}}, "texts": {"sheet": "08 TEXT TEMPLATES", "title": "CUSTOMER TEXT TEMPLATES  |  COPY + PERSONALIZE", "sub": "Keep messages short, conversational, and specific. Replace bracketed text. Send through FLYRA so contact history stays in one place.", "items": [{"situation": "New inquiry / missed call", "text": "Hi [NAME]! This is Emily with Edge Shines Christmas Lights. Thanks for reaching out! We provide the lights, custom design, installation, seasonal maintenance, takedown and storage. Do you have about 5–10 minutes today to go over a design for your home?", "when": "Send after initial missed call", "row": 6}, {"situation": "Need full property address", "text": "Hi [NAME]! To create an accurate lighting design and estimate, could you send the complete property address, including city and ZIP code? Thank you!", "when": "Before aerial look-up", "row": 7}, {"situation": "Budget qualification", "text": "Hi [NAME]! As a starting point, an average seasonal home is around $1,000, depending on the design and amount of lighting. Is there a budget you'd prefer we design around?", "when": "Before design investment", "row": 8}, {"situation": "Mockup ready", "text": "Hi [NAME]! We put together a Christmas lighting concept for your home. Take a look and let me know what you love or what you’d like us to adjust. Once we confirm the design, I can walk you through the seasonal price.", "when": "Send with photo", "row": 9}, {"situation": "Quote sent", "text": "Hi [NAME]! I just sent your Edge Shines Christmas lighting estimate for [SCOPE]. It includes company-provided lighting, installation, standard maintenance, takedown and storage. Let me know what questions you have, and we can review the next steps together.", "when": "Record sent date", "row": 10}, {"situation": "Option to lower budget", "text": "Hi [NAME]! If you’d like, I can revise the design to focus on the front roofline and keep the neat custom-fit look while bringing the price closer to [BUDGET]. Would you like me to try that version?", "when": "Create approved revision", "row": 11}, {"situation": "Need another decision-maker", "text": "Hi [NAME]! I sent the design and estimate so you and [OTHER PERSON] can review them together. Would a quick call [DAY/TIME] work to answer questions and make any changes?", "when": "Book a real call", "row": 12}, {"situation": "Agreement question", "text": "Hi [NAME]! Our 3-year agreement lets us custom-fit the materials in year one and handle the seasonal service again in seasons two and three. You pay one season at a time. I’m happy to go over the cancellation language before you decide.", "when": "Do not improvise fee terms", "row": 13}, {"situation": "Ready to proceed", "text": "Hi [NAME]! We’d love to decorate your home! The next step is reviewing and signing the agreement and taking care of the required deposit. Once everything is confirmed, we can finalize your installation scheduling.", "when": "Only after customer agrees", "row": 14}, {"situation": "Follow-up with specific choice", "text": "Hi [NAME]! Just checking in on your Christmas light design. Would you prefer we keep the current layout at [PRICE] or prepare the simpler [ALTERNATIVE] version? Happy to help either way!", "when": "Set follow-up task", "row": 15}, {"situation": "Home not visible in maps", "text": "Hi [NAME]! The street imagery isn't giving us a clear enough view of your roofline to quote accurately. Could you send a straight-on daytime photo of the front of your home? That should help us finish your estimate.", "when": "Don't guess measurement", "row": 16}], "standards": ["Use the customer's real name", "Confirm exact price and season before sending", "Don't state a date is booked without confirmation", "Record the conversation and specific next action in FLYRA"]}, "measure": {"sheet": "09 MEASURE SOP", "title": "MEASURE EVERY AREA · PHONE ESTIMATING SOP", "sub": "Use this flow during the first call. Match approved scope to real measurements. AI designs are visual only—not measuring tools.", "steps": [{"n": "01", "area": "Start with exact property", "measure": "Confirm street address, town, ZIP; open aerial/street imagery and confirm the right house.", "rule": "Ask whether front only, full roofline, or roofline plus add-ons.", "row": 4}, {"n": "02", "area": "ROOFLINE · C9", "measure": "Trace each approved gutter, gable, garage front, dormer and other installable edge in feet. Add segments once only.", "rule": "Satellite lengths may miss sloped rake length; check pitch/second-story access. Flag steep/hidden roof.", "row": 5}, {"n": "03", "area": "BUSHES · minis", "measure": "Count individual shrubs; note size, height and desired coverage (front/sides/full wrap). Estimate strands per shrub.", "rule": "Working starting point: ~5 strands per typical bush; actual count varies by size and strand length.", "row": 6}, {"n": "04", "area": "TREES · minis", "measure": "Count trees, approx. height, trunk/branch coverage, or canopy wrap; estimate strands by requested coverage.", "rule": "Working starting point: ~10 strands per moderate tree. Large/tall/dense trees require crew review.", "row": 7}, {"n": "05", "area": "GROUND STAKES · C9", "measure": "Trace each border run in feet: front walk, left driveway edge, right driveway edge, flowerbed border.", "rule": "Measure both driveway sides separately if requested. Note snowplows, lawn care, obstacles.", "row": 8}, {"n": "06", "area": "GREENERY · wreaths", "measure": "Count wreaths and choose diameter (24, 36, 48, 60 in); note lit/unlit, bows, height, attachment and wiring.", "rule": "Quote EACH item by approved size-specific rate; do not use roofline ft pricing.", "row": 9}, {"n": "07", "area": "GREENERY · garland", "measure": "Measure the actual linear feet of railing, porch, doorway, arch or columns to be decorated; count wrapped passes.", "rule": "Record lit/unlit, powered/battery, fullness, height. Pricing is owner-approved per item or foot.", "row": 10}, {"n": "08", "area": "Check installability", "measure": "Look for steep metal roofs, fragile surfaces, overhead wires, tall peaks, inaccessible gutters and power access.", "rule": "Escalate hard/uncertain install sections before a firm price.", "row": 11}, {"n": "09", "area": "Give price on call", "measure": "Use the 2026 rate card (3-year agreement): roofline + ground-stake ft × $6, mini strands × $30, plus counted greenery items.", "rule": "Give firm quote only when measurements, access and materials are verified; otherwise label preliminary.", "row": 12}, {"n": "10", "area": "Present & close", "measure": "Repeat covered areas and total seasonal price, show a matching mockup, and ask to proceed.", "rule": "In FLYRA: Convert to Customer → Subscription → quote; record call notes and next action.", "row": 13}], "checklist": ["Address matches visible property", "Desired lighting areas confirmed", "Both sides of driveway counted if requested", "Roofline segments not double-counted", "Bush/tree coverage and count noted", "Greenery sizes and wiring recorded", "Difficult access or roofs flagged", "Mockup matches the measured areas", "Tax and discounts approved"], "script": "“I can check your home from aerial imagery while we’re on the phone. I’ll measure just the sections you want, price the roofline and any landscaping separately, and give you the seasonal estimate. If a roof section isn’t clear or safe to verify remotely, I’ll let you know before confirming a final price.”"}, "price": {"sheet": "10 PRICE CARD", "title": "LIGHTING RATE CARD · 2026 · 3-YEAR AGREEMENT", "sub": "Current 2026 rates for the standard 3-year agreement. Confirm inventory, add-on pricing and tax before quoting.", "rates": [{"term": "3-year", "roof": 6, "mini": 30, "stake": 6, "row": 5}], "components": [{"comp": "ROOFLINE C9", "qty": "Approved installable roofline feet", "how": "Total feet × $6", "example": "150 ft × $6 = $900", "row": 10}, {"comp": "BUSHES · MINI LIGHTS", "qty": "Count bushes × strands needed per bush", "how": "Total approved mini strands × $30", "example": "4 bushes × 5 strands × $30 = $600", "row": 11}, {"comp": "TREES · MINI LIGHTS", "qty": "Count trees × strands needed per tree", "how": "Total approved mini strands × $30", "example": "1 tree × 10 strands × $30 = $300", "row": 12}, {"comp": "GROUND STAKES", "qty": "Linear feet of each requested walkway/driveway border", "how": "Total stake footage × $6", "example": "100 ft × $6 = $600", "row": 13}, {"comp": "WREATHS · GREENERY", "qty": "Count by size: 24, 36, 48, 60 in and any bows", "how": "Approved per-wreath price × quantity", "example": "Historical 36-in reference $225; CURRENT RATE UNCONFIRMED", "row": 14}, {"comp": "GARLAND · GREENERY", "qty": "Total actual linear ft OR number of approved sections", "how": "Current approved garland rate by foot/section × measured quantity", "example": "NO APPROVED RATE ON FILE — manager sets price", "row": 15}, {"comp": "OTHER LABOR / ACCESS", "qty": "Difficult peaks, high trees, special mounting, outlets", "how": "Only company-approved surcharge, separately disclosed", "example": "Never improvise labor charges or assert specific mounting method", "row": 16}], "example": {"label": "3-year agreement example", "scope": "150 ft roofline + 100 ft ground stakes + 20 mini strands", "calc": "$900 + $600 + $600", "total": "$2,100 per season before tax (50% deposit $1,050)"}, "scoping": [{"n": "01", "q": "“Do you want only the front roofline or all accessible rooflines?”", "row": 22}, {"n": "02", "q": "“How many individual bushes or trees should we wrap, and how full?”", "row": 23}, {"n": "03", "q": "“Would you like stakes on one or both sides of the driveway or walkway?”", "row": 24}, {"n": "04", "q": "“Any wreaths or garland? What sizes and which locations?”", "row": 25}, {"n": "05", "q": "“Which fixed C9 color would you like?”", "row": 26}], "safety": ["Do not price trees/bushes by roofline feet; use verified strand quantities.", "Do not promise exact garland/wreath pricing without approved rate.", "AI mockups do not give reliable footage.", "High roof, hidden slope, metal/aluminum attachment, and tall trees require review.", "Material counts are estimates until checked.", "Every agreement is 3 years; 40% cancellation follows the signed terms."]}};

(function () {

    if (ai.status === 'done' && !ai.ids.length) return `<div class="notice"><span class="ic">!</span><div><b>Claude found nothing in the playbook that answers this.</b> Don’t guess. Check with a manager.</div></div>`;
    if (ai.status === 'done') return `<div class="stack"><div class="secl">Claude’s picks from the playbook · wording is verbatim</div>${ai.ids.map(i => resCard(IDX[i], { ai: true, qset })).join('')}</div>`;
    return '';
  }
  function paintAi() { const b = $('#aibox'); if (b) b.innerHTML = aiHtml(new Set(tokens(query))); }

  /* ======================================================================
     STATE + ROUTING
     ====================================================================== */
  const VIEWS = ['home', 'flow', 'objections', 'estimate', 'mockups', 'flyra', 'texts', 'facts', 'playbook', 'review'];
  let view = VIEWS.includes(location.hash.slice(1)) ? location.hash.slice(1) : 'home';
  let flowStep = Math.max(0, Math.min(FLOW.length - 1, parseInt(store.get('step', 0), 10) || 0));
  let flowDone = (store.get('done', []) || []).filter(n => Number.isInteger(n));
  let objSel = 11, objCatSel = 'All', objFilter = '';
  let flyraChk = store.get('flyraChk', []), flyraPhase = null, flyraNotes = store.get('flyraNotes', {});
  let factFilter = '', query = '';

  function go(v, opt) {
    opt = opt || {};
    if (query) { query = ''; $('#q').value = ''; syncClear(); }
    view = v;
    if (opt.step != null) flowStep = opt.step;
    if (opt.id && v === 'flow' && opt.id in flowHome) flowStep = flowHome[opt.id];
    if (v === 'flow') store.set('step', flowStep);
    if (opt.obj) { objSel = opt.obj; objCatSel = 'All'; objFilter = ''; }
    if (opt.phase != null) flyraPhase = opt.phase;
    if (location.hash.slice(1) !== v) history.replaceState(null, '', '#' + v);
    render();
    window.scrollTo(0, 0);
    if (opt.id) requestAnimationFrame(() => flashEl(opt.id));
  }
  function flashEl(id) {
    const el = document.getElementById(id); if (!el) return;
    let d = el.closest('details');
    while (d) { d.open = true; d = d.parentElement ? d.parentElement.closest('details') : null; }
    el.scrollIntoView({ block: 'center' }); el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 1700);
  }
  window.addEventListener('hashchange', () => { const v = location.hash.slice(1); if (VIEWS.includes(v) && v !== view) go(v); });

  function render() {
    reg = new Map();
    $$('.nav').forEach(b => b.setAttribute('aria-current', !query && b.dataset.view === view ? 'page' : 'false'));
    $('#main').innerHTML = query ? vSearch() : ({ home: vHome, flow: vFlow, objections: vObj, estimate: vEst, mockups: vMock, flyra: vFlyra, texts: vTexts, facts: vFacts, playbook: vPlaybook, review: vReview }[view])();
    if (!query && view === 'estimate') estRecalc();
    syncPrefs();
  }

  /* ---------- Preferences (name in scripts, text size) ---------- */
  const prefsHtml = id => `<div class="prefs stack"><div class="fills"><label>Your name in scripts<input id="${id}" data-rep autocomplete="off" placeholder="Emily (default)"></label></div>
    <div class="stack" style="gap:6px"><span class="secl">Text size</span><div class="termseg sm" role="group" aria-label="Text size"><button type="button" data-size="std">Standard</button><button type="button" data-size="lg">Large</button></div></div></div>`;
  function syncPrefs() { const s = store.get('size', 'std'); $$('[data-size]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.size === s))); syncRep(); }
  const setHH = () => {
    qIn.placeholder = window.innerWidth < 560 ? 'Search the playbook' : 'Ask anything: “customer doesn’t want a 3-year agreement”';
    const h = $('.top'); if (h) document.documentElement.style.setProperty('--hh', h.offsetHeight + 'px');
  };
  function setSize(s) { store.set('size', s); document.documentElement.style.fontSize = s === 'lg' ? '112.5%' : ''; syncPrefs(); setHH(); }

  /* ---------- Home ---------- */
  function vHome() {
    const r3 = rateFor('3-year');
    const tile = (l, v, d, s, pill) => `<div class="tile"><span class="l">${esc(l)}</span><span class="v">${v}</span><span class="d">${d}</span><span class="row">${pill || ''}<span class="src">${s}</span></span></div>`;
    const confirm = '<span class="pill warn">Confirm</span>';
    const inProgress = flowStep > 0 || flowDone.length;
    return `<div class="vhead"><div><div class="eyebrow">Christmas light sales</div><h1>Quick start</h1><p>Search anything above, or start a call and follow the 12 steps. Every answer shows where it came from in the playbook.</p></div></div>
    <div class="quick">
      <button class="qbtn lead" data-go="flow" ${inProgress ? '' : 'data-step="0"'}><b>${inProgress ? 'Continue the call' : 'Start a call'}</b><span>${inProgress ? `Step ${flowStep + 1}: ${esc(FLOW[flowStep].t)}` : '12-step call flow with scripts'}</span></button>
      <button class="qbtn" data-go="objections"><b>Objections</b><span>28 answers with follow-up questions</span></button>
      <button class="qbtn" data-go="estimate"><b>Estimator</b><span>Roofline, bushes, trees, stakes, greenery</span></button>
      <button class="qbtn" data-go="mockups"><b>AI mockup prompts</b><span>The 3 approved prompts</span></button>
      <button class="qbtn" data-go="flyra"><b>FLYRA quoting</b><span>Lead → Customer → Subscription → Quote</span></button>
    </div>
    <section class="panel phone-only"><h3>Your settings</h3>${prefsHtml('rep3')}</section>
    <section class="panel"><h3>Common questions</h3><div class="row">${SUGGEST.map(s => `<button class="chip" data-q="${esc(s)}">${esc(s)}</button>`).join('')}</div></section>
    <section class="stack"><div class="secl">Key numbers</div><div class="tiles">
      ${tile('Typical home', '~$1,000', 'per season. A general expectation, not a quote', src('facts', 29), '')}
      ${tile('Agreement', '3 years', 'the only agreement offered; billed one season at a time', src('facts', 25), '')}
      ${tile('Roofline C9', `$${r3.roof}`, 'per linear ft', src('price', 5), '')}
      ${tile('Ground stakes', `$${r3.stake}`, 'per linear ft', src('price', 5), '')}
      ${tile('Mini lights', `$${r3.mini}`, 'per strand (bushes & trees)', src('price', 5), '')}
      ${tile('Deposit', '50%', 'standard; balance generally due on completed install', src('facts', 24), confirm)}
      ${tile('Early cancellation', '40%', 'of that year’s seasonal bill; signed terms control', src('facts', 27), confirm)}
      ${tile('Bulb spacing', '~15 in', 'typical roofline unless the design says otherwise', src('facts', 12), '')}
      ${tile('Starting points', '5 · 10', 'strands per typical bush · moderate tree', src('measure', 6), '')}
    </div></section>
    <div class="grid2">
      <section class="panel"><h3>Never promise these without checking</h3>${D.script.never.map(n => ruleRow(n, src('script', 25))).join('')}</section>
      <section class="panel"><h3>Every call ends with 6 FLYRA facts</h3>${D.sop.facts.map((f, i) => `<div class="do"><span class="n">${i + 1}</span><div class="t">${esc(f)}</div></div>`).join('')}<span class="src">${src('sop', 29)}</span></section>
    </div>`;
  }

  /* ---------- Search results ---------- */
  function resCard(e, o) {
    o = o || {};
    const qset = o.qset || new Set(), T = x => hl(x, qset, e.noRep);
    const fields = (e.fields || []).filter(f => f[1]);
    return `<article class="res ${o.best ? 'best' : ''} ${o.ai ? 'aipick' : ''}">
      <div class="hd">${o.best ? '<span class="pill ok">Best answer</span>' : ''}${o.ai ? '<span class="pill info">Claude’s pick</span>' : ''}<span class="tp ${e.cls}">${esc(e.type)}</span><h3>${T(e.title)}</h3></div>
      <div class="main">${T(e.main)}</div>
      ${fields.length ? `<div class="fld">${fields.map(f => `<span>${esc(f[0])}</span><span>${T(f[1])}</span>`).join('')}</div>` : ''}
      <div class="ft"><span class="src">Source: ${e.src}</span><span class="row">
        ${e.noCopy ? '' : copyBtn(e.main, e.type === 'Objection' ? 'Copy response' : 'Copy')}
        ${e.next ? copyBtn(() => rep(e.main + ' ' + e.next), 'Copy response + question') : ''}
        <button class="btn sm" data-goto="${e.i}">Open in section →</button></span></div>
    </article>`;
  }
  function vSearch() {
    const r = search(query), qset = new Set(r.qt);
    const chips = `<section class="panel"><h3>Common questions</h3><div class="row">${SUGGEST.map(s => `<button class="chip" data-q="${esc(s)}">${esc(s)}</button>`).join('')}</div></section>`;
    if (!r.qt.length) return `<div class="vhead"><div><div class="eyebrow">Search</div><h1>Keep typing…</h1><p>Add a word or two about what the customer said or what you need.</p></div><button class="btn" data-clear>Clear search</button></div>${chips}`;
    if (!r.res.length) return `<div class="vhead"><div><div class="eyebrow">Search</div><h1>No match for “${esc(query)}”</h1><p>The playbook doesn’t cover this in those words, so don’t guess an answer. Try different words, or check with a manager.</p></div><button class="btn" data-clear>Clear search</button></div>
      <div id="aibox">${aiHtml(qset)}</div>${chips}`;
    const weak = r.qt.length > 1 && r.res[0].cov < 0.6;
    const cards = r.res.map((x, i) => resCard(x.e, { best: i === 0 && !weak, qset }));
    return `<div class="vhead"><div><div class="eyebrow">Search · ${r.res.length} match${r.res.length > 1 ? 'es' : ''} across the playbook</div><h1>“${esc(query)}”</h1></div><button class="btn" data-clear>Clear search</button></div>
      ${weak ? `<div class="notice"><span class="ic">!</span><div><b>Partial match.</b> Some words in your question aren’t in the playbook, so these results may not answer it exactly. Read the source before you use one, and check with a manager if it doesn’t fit.</div></div><div id="aibox">${aiHtml(qset)}</div>` : ''}
      <div class="stack">${cards[0]}${weak ? '' : `<div id="aibox">${aiHtml(qset)}</div>`}${cards.slice(1).join('')}</div>`;
  }

  /* ---------- Call flow ---------- */
  function liveEstHtml() {
    const c = estCalc(est), st = estStatus(c);
    if (!c.total) return `<section class="panel"><h3>Current estimate</h3><p class="muted">Nothing priced yet.</p><div class="row"><button class="btn primary" data-go="estimate">Open the estimator →</button></div></section>`;
    return `<section class="panel"><h3>Current estimate <span class="small muted">from the estimator${est.example ? ' · example data' : ''}</span></h3>
      <div class="row" style="justify-content:space-between"><span class="bignum">${money(c.total)}</span>${st.firm ? '<span class="pill ok">Ready for firm quote</span>' : '<span class="pill bad">Preliminary</span>'}</div>
      <span class="small muted">per season · 3-year agreement · deposit ${money(c.total * 0.5)} (standard 50%) · balance ${money(c.total * 0.5)} · before tax</span>
      <div class="row">${copyBtn(() => st.firm ? firmSay(c.total) : prelimSay(), st.firm ? 'Copy price script' : 'Copy preliminary script')}<button class="btn sm" data-go="estimate">Open estimator →</button></div></section>`;
  }
  function vFlow() {
    const s = FLOW[flowStep];
    const list = FLOW.map((x, i) => `<button class="stp ${flowDone.includes(i) ? 'done' : ''}" data-step="${i}" aria-current="${i === flowStep ? 'step' : 'false'}"><span class="num">${flowDone.includes(i) ? '✓' : i + 1}</span><span class="ttl">${esc(x.t)}</span></button>`).join('');
    const sayHtml = s.say.map(x => sayBlock(x.label, x.text, x.src, { id: x.id, after: x.after, big: s.say.length < 3 })).join('');
    const doHtml = s.doo.map(x => doRow(x.n, x.title, x.text, x.src, x.extra, x.id)).join('');
    const facts = (s.facts || []).map(t => factRow(fact(t))).join('');
    const rules = s.rules.map(r => ruleRow(r.text, r.src, r.ok, null, r.id)).join('');
    const objs = (s.objs || []).map(r => `<button class="ocard" data-objgo="${r}"><span>“${esc(obj(r).says)}”</span><small>${esc(objCat[r])} →</small></button>`).join('');
    const wf = s.wf ? `<section class="panel"><h3>FLYRA quoting workflow</h3><div class="wf">${WF.map(([n], i) => (i ? '<span class="arrow" aria-hidden="true">→</span>' : '') + `<button class="wfb" data-flyraphase="${i}">${esc(n)}</button>`).join('')}</div><span class="small muted">Tap a stage to open its steps.</span></section>` : '';
    const never = s.never ? `<section class="panel" id="never"><h3>Never promise these without checking</h3>${D.script.never.map(n => ruleRow(n, src('script', 25))).join('')}</section>` : '';
    const six = s.sixFacts ? `<section class="panel" id="sixfacts"><h3>Every call ends with 6 FLYRA facts</h3>${D.sop.facts.map((f, i) => `<div class="do"><span class="n">${i + 1}</span><div class="t">${esc(f)}</div></div>`).join('')}<span class="src">${src('sop', 29)}</span></section>` : '';
    const chk = s.checklist ? `<section class="panel"><h3>Quote checkpoint before saying a final total</h3>${D.fast.checkpoint.map(c => `<div class="do"><span class="n">□</span><div class="t"><b>${esc(c.verify)}</b> — ${esc(c.why)}<div class="small muted">${esc(c.action)}</div><div class="src">${src('fast', c.row)}</div></div></div>`).join('')}</section>` : '';
    return `<div class="vhead"><div><div class="eyebrow">Sales SOP · call flow</div><h1>Follow these 12 steps on every call</h1><p>${esc(D.sop.sub)}</p></div>

          <div class="row">${flowStep > 0 ? '<button class="btn" data-stepnav="-1">← Back</button>' : ''}${flowStep < 11 ? '<button class="btn primary" data-stepnav="1">Done, next step →</button>' : '<button class="btn primary" data-stepnav="1">Mark call complete ✓</button>'}</div></div>
        <div class="cols">
          <div class="stack"><div class="secl">Say</div>${sayHtml}${objs ? `<div class="secl">Most common objections</div><div class="olist">${objs}</div>` : ''}</div>
          <div class="stack">
            ${s.live ? liveEstHtml() : ''}
            ${doHtml ? `<section class="panel"><h3>Do</h3><div>${doHtml}</div></section>` : ''}
            ${facts ? `<section class="panel"><h3>Facts to have ready</h3><div>${facts}</div></section>` : ''}
            ${rules ? `<section class="panel"><h3>Watch for</h3>${rules}</section>` : ''}
            ${wf}
            ${s.link ? `<div class="row"><button class="btn primary" data-go="${s.link.view}">${esc(s.link.label)} →</button></div>` : ''}
          </div>
        </div>
        ${chk}${never}${six}
      </div></div>`;
  }

  /* ---------- Objections ---------- */
  function vObj() {
    const f = objFilter.trim();
    let items = D.obj.items.filter(o => objCatSel === 'All' || objCat[o.row] === objCatSel);
    if (f) { const ft = new Set(tokens(f)); items = items.filter(o => tokens(o.says + ' ' + o.answer + ' ' + o.next + ' ' + objCat[o.row] + ' ' + (OBJ_KW[o.row] || '')).some(t => ft.has(t)) || norm(o.says).includes(norm(f))); }
    const o = obj(objSel);
    const cats = ['All'].concat(OBJ_CATS.map(c => c[0]));
    const card = (x, showCat) => `<button class="ocard" data-obj="${x.row}" aria-pressed="${x.row === objSel}"><span>“${esc(x.says)}”</span>${showCat ? `<small>${esc(objCat[x.row])}</small>` : ''}</button>`;
    const listHtml = objCatSel === 'All' && !f
      ? OBJ_CATS.map(([c, rows]) => `<div class="ogrp">${esc(c)}</div>` + rows.map(r => card(obj(r), false)).join('')).join('')
      : (items.length ? items.map(x => card(x, true)).join('') : '<div class="empty">No objections match. Try the main search above.</div>');

      <div class="row">${cats.map(c => `<button class="chip" data-cat="${esc(c)}" aria-pressed="${c === objCatSel}">${esc(c)} (${c === 'All' ? D.obj.items.length : OBJ_CATS.find(x => x[0] === c)[1].length})</button>`).join('')}</div>
      <div class="objs">
        <div class="stack"><input class="filter" id="objf" type="search" placeholder="Filter objections, e.g. contract, color, roof" value="${esc(objFilter)}" aria-label="Filter objections">
          <div class="olist">${listHtml}</div></div>
        <div class="odetail"><section class="panel" id="objd">

  /* ---------- Estimator ---------- */

  function vEst() {
    const r = rateFor('3-year'), comp = row => by(D.price.components, row);

    const garRows = est.garland.map((x, i) => ln('garland', i, inp(`garland.${i}.label`, x.label, 'Location') + inp(`garland.${i}.qty`, x.qty, 'Qty', 'n') + `<select id="e-garland-${i}-unit" data-est="garland.${i}.unit" aria-label="Unit"><option value="ft" ${x.unit !== 'section' ? 'selected' : ''}>ft</option><option value="section" ${x.unit === 'section' ? 'selected' : ''}>sections</option></select>` + inp(`garland.${i}.rate`, x.rate, '$ rate', 'n'))).join('');
    const laborRows = est.labor.map((x, i) => ln('labor', i, inp(`labor.${i}.label`, x.label, 'Approved surcharge reason') + inp(`labor.${i}.amt`, x.amt, '$ amount', 'n'))).join('');
    return `<div class="vhead"><div><div class="eyebrow">Measuring &amp; pricing</div><h1>Estimate while the customer is on the phone</h1>
      <p>Enter verified measurements. Prices use the 2026 rate card for the <b>3-year agreement</b>: roofline $6/ft, ground stakes $6/ft, mini lights $30/strand.</p></div>

      ${est.example ? `<div class="rule"><span class="ic">i</span><div>Example loaded: the ${esc(D.price.example.label)} from the price card (${esc(D.price.example.scope)} = ${esc(D.price.example.total)}). Clear it before quoting a real customer.<div class="src">${src('price', 19)}</div></div></div>` : ''}
      <div class="row" id="rates"><span class="secl">Agreement</span><span class="pill ok">3-Year Christmas Lighting Agreement</span><span class="pill info">2026 rates</span><span class="src">${src('price', r.row, 'Lighting rate card')}</span></div>
      ${ruleRow(D.fast.rateNote, src('fast', 20, 'Pricing reference'))}
      <div class="est"><div class="stack">

  function estRecalc() {
    store.set('est', est);
    const sumEl = $('#estsum'); if (!sumEl) return;
    const c = estCalc(est), st = estStatus(c);
    const sub = (k, n, unit, rate) => `<span>${n} ${unit}</span><b>${money(n * rate)}</b>`;
    const subMan = k => {
      let p = 0, m = 0;
      est[k].forEach(x => { const q = k === 'labor' ? 1 : num(x.qty), rt = k === 'labor' ? num(x.amt) : num(x.rate); if (k === 'labor' ? (rt || (x.label || '').trim()) : q) { if (rt) p += q * rt; else m++; } });
      return (m ? `<span class="need">${m} line${m > 1 ? 's need' : ' needs'} a rate. Not in total.</span>` : '<span></span>') + `<b>${money(p)}</b>`;
    };
    const subs = { roof: sub('roof', c.roofFt, 'ft', c.r.roof), bush: sub('bush', c.bs, 'strands', c.r.mini), tree: sub('tree', c.ts, 'strands', c.r.mini), stake: sub('stake', c.sf, 'ft', c.r.stake), wreath: subMan('wreath'), garland: subMan('garland'), labor: subMan('labor') };
    Object.entries(subs).forEach(([k, h]) => { const el = $('#sub-' + k); if (el) el.innerHTML = h; });
    const dep = c.total * 0.5;
    sumEl.innerHTML = `<div class="tot"><span class="lbl">Estimated seasonal total · 3-year agreement</span><span class="big">${money(c.total)}</span>
        <span class="small note">Before tax and approved changes. Tax rules are not in the playbook.</span>
        <div class="dep"><span>Deposit (standard 50%)</span><b>${money(dep)}</b><span>Remaining seasonal balance, due on completed install</span><b>${money(c.total - dep)}</b></div>
        <span class="small note">3-year agreement: ${money(c.total)} per season × 3 seasons = ${money(c.total * 3)}, assuming the same scope and annual price. Billed one season at a time, never upfront.</span></div>
      <section class="panel">${st.firm ? '<span class="pill ok">Ready for firm quote</span>' : '<span class="pill bad">Preliminary. Don’t call this a firm price</span>'}
        ${st.firm ? '<span class="small muted">Verified on this call, all checkpoints ticked, no escalation flags, and every line has a rate.</span>' : `<ul class="small" style="margin:0;padding-left:18px">${st.reasons.map(x => `<li>${esc(x)}</li>`).join('')}</ul>`}
        <div class="items">${c.lines.map(l => `<span>${esc(l[0])}</span><span class="r">${money(l[1])}</span>`).join('') || '<span class="muted">No priced lines</span><span></span>'}</div>
        ${c.missing.length ? `<div class="need">Not in total (rate needed): ${esc(c.missing.join(', '))}</div>` : ''}
        <span class="src">Deposit: ${src('facts', 24)}</span></section>`;
    $('#estrange').hidden = st.firm;
    $('#estsay').innerHTML = st.firm ? sayBlock('Say this', firmSay(c.total), src('script', 15)) : sayBlock('Say this (preliminary)', prelimSay(), src('fast', 32));
    const recap = () => {
      const L = ['Edge Shines Christmas lighting estimate (3-Year Christmas Lighting Agreement)'];
      est.roof.filter(x => num(x.ft)).forEach(x => L.push(`  Roofline: ${x.label || 'section'} ${num(x.ft)} ft`));
      est.bush.filter(x => num(x.count)).forEach(x => L.push(`  Bushes: ${x.label || 'bushes'} ${num(x.count)} × ${num(x.per)} strands`));
      est.tree.filter(x => num(x.count)).forEach(x => L.push(`  Trees: ${x.label || 'trees'} ${num(x.count)} × ${num(x.per)} strands`));
      est.stake.filter(x => num(x.ft)).forEach(x => L.push(`  Ground stakes: ${x.label || 'run'} ${num(x.ft)} ft`));
      L.push('Pricing:'); c.lines.forEach(l => L.push(`  ${l[0]} = ${money(l[1])}`));
      if (c.missing.length) L.push('Not priced (rate needed): ' + c.missing.join('; '));
      L.push(`Seasonal total: ${money(c.total)} per season before tax/approved changes`);
      L.push(`Deposit (standard 50%): ${money(dep)} · Remaining seasonal balance: ${money(c.total - dep)}`);
      L.push(`3-year agreement: ${money(c.total * 3)} across 3 seasons, same scope and annual price; billed per season`);
      L.push(`Status: ${st.firm ? 'Firm. Measurements, access and materials verified' : 'PRELIMINARY. ' + st.reasons.join('; ')}`);
      if (!st.firm && num(est.lo) && num(est.hi)) L.push(`Preliminary range given: ${money(Math.min(num(est.lo), num(est.hi)))}–${money(Math.max(num(est.lo), num(est.hi)))}`);
      L.push('Rates: 2026 rate card ($6/ft roofline, $6/ft ground stakes, $30/strand).');
      return L.join('\n');
    };
    $('#estcmp').innerHTML = `<div class="row">${copyBtn(recap, 'Copy quote recap for FLYRA', 'primary')}<button type="button" class="btn sm" data-go="flyra">FLYRA quoting →</button></div>`;
  }
