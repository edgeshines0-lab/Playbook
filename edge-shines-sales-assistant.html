<title>Edge Shines Sales Assistant</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:wght@400;600;700&display=swap">
<style>
/* Layout: sticky navy header with search, sidebar nav, working canvas. Brand: navy + teal on cool white. */
:root{
  --hdr:#0e2240; --hdr-2:#18355f; --hdr-fg:#ffffff; --hdr-muted:#b9c7da;
  --bg:#f2f5f8; --surface:#ffffff; --surface-2:#f7f9fb; --line:#d6dee8; --fg:#0f1c2f; --muted:#55667c;
  --teal:#0b7f82; --teal-hover:#096b6d; --on-teal:#ffffff; --teal-soft:#e2f2f2; --teal-ink:#075d60;
  --warn:#8a5200; --warn-bg:#fff3dc; --bad:#b42318; --bad-bg:#fdeceb; --ok:#17703d; --ok-bg:#e4f3ea;
  --mark:#ffec99; --focus:#f2a900;
  --f-display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --hdr:#07142a; --hdr-2:#11264a; --hdr-fg:#f2f6fb; --hdr-muted:#94a7c2;
  --bg:#0a1424; --surface:#101e34; --surface-2:#0d1a2e; --line:#22364f; --fg:#e6edf6; --muted:#9badc3;
  --teal:#38bcbe; --teal-hover:#56cfd1; --on-teal:#04202a; --teal-soft:#0e3238; --teal-ink:#7fdadb;
  --warn:#f2b65a; --warn-bg:#36270b; --bad:#ff8b80; --bad-bg:#3b1513; --ok:#71d39c; --ok-bg:#0e2f1f;
  --mark:#5b4a00; --focus:#f2b65a; color-scheme:dark}}
:root[data-theme="dark"]{
  --hdr:#07142a; --hdr-2:#11264a; --hdr-fg:#f2f6fb; --hdr-muted:#94a7c2;
  --bg:#0a1424; --surface:#101e34; --surface-2:#0d1a2e; --line:#22364f; --fg:#e6edf6; --muted:#9badc3;
  --teal:#38bcbe; --teal-hover:#56cfd1; --on-teal:#04202a; --teal-soft:#0e3238; --teal-ink:#7fdadb;
  --warn:#f2b65a; --warn-bg:#36270b; --bad:#ff8b80; --bad-bg:#3b1513; --ok:#71d39c; --ok-bg:#0e2f1f;
  --mark:#5b4a00; --focus:#f2b65a; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--hdr)}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;line-height:1.15;text-wrap:balance}
h1{font-size:1.9rem;font-weight:700}
h2{font-size:1.45rem;font-weight:700}
h3{font-size:1.15rem;font-weight:600}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
mark{background:var(--mark);color:inherit;border-radius:2px;padding:0 1px}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--hdr);color:var(--hdr-fg);
  padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:grid;grid-template-columns:220px minmax(0,1fr) auto;gap:20px;align-items:center}
.brand{display:flex;flex-direction:column;gap:2px;cursor:pointer;background:none;border:0;padding:0;text-align:left;color:inherit}
.brand b{font-family:var(--f-display);font-size:1.45rem;letter-spacing:.08em;font-weight:700;line-height:1}
.brand b i{font-style:normal;color:var(--teal)}
.brand span{font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--hdr-muted)}
.search{position:relative;display:flex;align-items:center}
.search svg{position:absolute;left:16px;width:22px;height:22px;color:#5d7088;pointer-events:none}
.search input{width:100%;height:54px;border-radius:10px;border:2px solid transparent;background:#ffffff;color:#0f1c2f;
  font-size:1.12rem;padding:0 92px 0 50px}
.search input::-webkit-search-cancel-button{display:none}
.search input::placeholder{color:#6a7b90}
.search input:focus{border-color:var(--teal);outline:none}
.search .clear{position:absolute;right:10px;height:36px;padding:0 12px;border-radius:6px;border:0;background:#e8edf3;color:#25364d;cursor:pointer;font-size:.9rem}
.search kbd{position:absolute;right:14px;font-family:var(--f-mono);font-size:.8rem;color:#6a7b90;border:1px solid #c9d3df;border-radius:4px;padding:1px 7px}
.rep{display:flex;flex-direction:column;gap:3px;font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;color:var(--hdr-muted)}
.rep input{width:150px;height:36px;border-radius:6px;border:1px solid var(--hdr-2);background:var(--hdr-2);color:var(--hdr-fg);padding:0 10px;font-size:.95rem;letter-spacing:0;text-transform:none}

/* Shell */
.shell{display:grid;grid-template-columns:236px minmax(0,1fr);align-items:start;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 78px);max-height:calc(100vh - 78px);overflow:auto;
  padding:16px 12px 24px 16px;display:flex;flex-direction:column;gap:4px;border-right:1px solid var(--line);min-height:calc(100vh - 78px)}
.side .grp{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:14px 12px 4px}
.nav{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;padding:10px 12px;border-radius:7px;cursor:pointer;font-size:1rem;color:var(--fg)}
.nav:hover{background:var(--surface)}
.nav[aria-current="page"]{background:var(--teal);color:var(--on-teal);font-weight:600}
.nav .k{margin-left:auto;font-family:var(--f-mono);font-size:.72rem;opacity:.7}
main{min-width:0;padding-block:24px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:20px;max-width:1280px}
@media (min-width:900px){main{padding-left:28px;padding-right:28px}}

.vhead{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px}
.vhead p{color:var(--muted);max-width:70ch;margin-top:4px}
.eyebrow{font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;color:var(--teal-ink);font-weight:700}

/* Generic blocks */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel > h3{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.src{font-family:var(--f-mono);font-size:.74rem;color:var(--muted);letter-spacing:.01em}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.74rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:3px 10px;white-space:nowrap}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.info{background:var(--teal-soft);color:var(--teal-ink)}
.btn{display:inline-flex;align-items:center;gap:7px;border-radius:7px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;cursor:pointer;font-weight:600;font-size:.95rem;white-space:nowrap}
.btn:hover{border-color:var(--teal);color:var(--teal-ink)}
.btn.primary{background:var(--teal);border-color:var(--teal);color:var(--on-teal)}
.btn.primary:hover{background:var(--teal-hover);color:var(--on-teal)}
.btn.sm{padding:5px 10px;font-size:.85rem}
.btn.copied{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.btn svg{width:16px;height:16px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;cursor:pointer;font-size:.95rem;text-align:left}
.chip:hover{border-color:var(--teal);color:var(--teal-ink)}
.chip[aria-pressed="true"]{background:var(--hdr);border-color:var(--hdr);color:var(--hdr-fg)}
.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%,30%{box-shadow:0 0 0 4px var(--focus)}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){.flash{animation:none;box-shadow:0 0 0 3px var(--focus)}}

/* Say blocks: the words a rep reads aloud */
.say{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.say .lbl{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.say .lbl b{font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--teal-ink)}
.say q{quotes:none;font-size:1.14rem;line-height:1.55}
.say.big q{font-size:1.24rem}
.say .meta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.do{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;padding:10px 0;border-top:1px solid var(--line)}
.do:first-of-type{border-top:0}
.do .n{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);padding-top:3px;min-width:22px}
.do .t b{font-weight:600}
.rule{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:7px;background:var(--warn-bg);color:var(--fg)}
.rule .ic{color:var(--warn);font-weight:800;font-family:var(--f-mono)}
.okrule{background:var(--ok-bg)}
.okrule .ic{color:var(--ok)}
.fact{padding:10px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:3px}
.fact:first-child{border-top:0}
.fact b{font-weight:700}
.chk{display:flex;gap:10px;align-items:flex-start;padding:7px 0;cursor:pointer}
.chk input{width:20px;height:20px;margin-top:2px;accent-color:var(--teal);flex:none}

/* Home */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.tile .v{font-family:var(--f-display);font-size:1.7rem;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.tile .l{font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.tile .d{font-size:.9rem;color:var(--muted)}
.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.qbtn{display:flex;flex-direction:column;gap:4px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px 16px;cursor:pointer}
.qbtn:hover{border-color:var(--teal)}
.qbtn b{font-family:var(--f-display);font-size:1.2rem}
.qbtn span{color:var(--muted);font-size:.92rem}
.qbtn.lead{background:var(--hdr);color:var(--hdr-fg);border-color:var(--hdr)}
.qbtn.lead span{color:var(--hdr-muted)}

/* Search */
.res{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.res.best{border:2px solid var(--teal)}
.res .hd{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.res h3{font-size:1.2rem}
.res .fld{display:grid;grid-template-columns:130px minmax(0,1fr);gap:4px 14px}
.res .fld > span:nth-child(odd){font-size:.76rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;padding-top:3px}
.res .main{font-size:1.1rem;line-height:1.55}
.res.best .main{font-size:1.2rem}
.res .ft{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.tp{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700;padding:3px 9px;border-radius:5px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
.tp.Objection{background:var(--teal-soft);color:var(--teal-ink);border-color:transparent}
.tp.Script{background:var(--hdr);color:var(--hdr-fg);border-color:transparent}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}

/* Call flow */
.flow{display:grid;grid-template-columns:290px minmax(0,1fr);gap:18px;align-items:start}
.steps{display:flex;flex-direction:column;gap:4px;position:sticky;top:96px}
.stp{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:8px;align-items:center;text-align:left;border:1px solid transparent;background:none;border-radius:7px;padding:8px 10px;cursor:pointer;font-size:.98rem}
.stp:hover{background:var(--surface)}
.stp .num{font-family:var(--f-mono);font-size:.85rem;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line);background:var(--surface)}
.stp.done .num{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.stp[aria-current="step"]{background:var(--surface);border-color:var(--teal)}
.stp[aria-current="step"] .num{background:var(--teal);border-color:var(--teal);color:var(--on-teal)}
.stepbody{display:flex;flex-direction:column;gap:16px;min-width:0}
.stephead{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:flex-start}
.stephead h2{font-size:1.7rem}
.cols{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;align-items:start}
.stack{display:flex;flex-direction:column;gap:12px;min-width:0}
.secl{font-size:.76rem;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--muted)}

/* Objections */
.objs{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:18px;align-items:start}
.olist{display:flex;flex-direction:column;gap:6px}
.ocard{display:flex;justify-content:space-between;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:11px 14px;cursor:pointer;font-size:1rem}
.ocard:hover{border-color:var(--teal)}
.ocard[aria-pressed="true"]{border:2px solid var(--teal);padding:10px 13px;background:var(--teal-soft)}
.ocard small{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.odetail{position:sticky;top:96px}
.cust{font-family:var(--f-display);font-size:1.5rem;font-weight:600}
.filter{height:44px;border-radius:7px;border:1px solid var(--line);background:var(--surface);padding:0 14px;min-width:0;flex:1 1 220px;font-size:1rem}

/* Estimator */
.est{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:18px;align-items:start}
.tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:14px}
.tool{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.tool .th{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.tool .th h3{font-size:1.12rem}
.rate{font-family:var(--f-mono);font-size:.82rem;color:var(--teal-ink);font-weight:500}
.lines{display:flex;flex-direction:column;gap:6px}
.ln{display:grid;gap:6px;align-items:center}
.ln input,.ln select{height:40px;border-radius:6px;border:1px solid var(--line);background:var(--surface-2);padding:0 9px;min-width:0;width:100%;font-variant-numeric:tabular-nums}
.ln .x{width:34px;height:34px;border:0;background:none;color:var(--muted);cursor:pointer;border-radius:6px;font-size:1.2rem}
.ln .x:hover{background:var(--bad-bg);color:var(--bad)}
.ln.roof,.ln.stake{grid-template-columns:minmax(0,1fr) 96px 34px}
.ln.bush{grid-template-columns:minmax(0,1fr) 70px 70px 34px}
.ln.wreath{grid-template-columns:90px 60px minmax(0,1fr) 34px}
.ln.garland{grid-template-columns:minmax(0,1fr) 64px 86px 84px 34px}
.ln.labor{grid-template-columns:minmax(0,1fr) 100px 34px}
.ln.hd{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.sub{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-variant-numeric:tabular-nums;border-top:1px dashed var(--line);padding-top:8px}
.sub b{font-size:1.05rem}
.need{font-size:.85rem;color:var(--bad);font-weight:600}
.termseg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.termseg button{border:0;background:none;padding:10px 18px;cursor:pointer;font-weight:600;font-size:1rem;border-left:1px solid var(--line)}
.termseg button:first-child{border-left:0}
.termseg button[aria-pressed="true"]{background:var(--hdr);color:var(--hdr-fg)}
.summary{position:sticky;top:96px;display:flex;flex-direction:column;gap:12px}
.tot{background:var(--hdr);color:var(--hdr-fg);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.tot .big{font-family:var(--f-display);font-size:2.6rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.tot .lbl{font-size:.74rem;letter-spacing:.12em;text-transform:uppercase;color:var(--hdr-muted);font-weight:700}
.tot .dep{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-variant-numeric:tabular-nums;border-top:1px solid var(--hdr-2);padding-top:8px;margin-top:4px}
.tot .dep span:nth-child(odd){color:var(--hdr-muted)}
.items{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;font-variant-numeric:tabular-nums;font-size:.95rem}
.items .r{text-align:right}
.cmp{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:.95rem}
.cmp td,.cmp th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right}
.cmp th:first-child,.cmp td:first-child{text-align:left}
.cmp tr.on td{font-weight:700;color:var(--teal-ink)}
details{border-top:1px solid var(--line);padding-top:8px}
summary{cursor:pointer;font-weight:600;padding:4px 0}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;width:100%;font-size:.93rem;min-width:560px}
.tbl th,.tbl td{text-align:left;vertical-align:top;padding:8px 10px;border-bottom:1px solid var(--line)}
.tbl th{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

/* Fill-in templates */
.fills{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.fills label{display:flex;flex-direction:column;gap:3px;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.fills input,.fills textarea,.inp{height:40px;border-radius:6px;border:1px solid var(--line);background:var(--surface-2);padding:0 10px;font-size:1rem;letter-spacing:0;text-transform:none;color:var(--fg);font-weight:400;width:100%}
.fills textarea{height:72px;padding:8px 10px;resize:vertical}
.ph{background:var(--warn-bg);color:var(--warn);border-radius:3px;padding:0 3px;font-weight:600}
.filled{background:var(--teal-soft);color:var(--teal-ink);border-radius:3px;padding:0 3px;font-weight:600}
.prompt{font-size:1rem;line-height:1.6;background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:14px 16px;white-space:pre-wrap}

/* FLYRA */
.wf{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.wfb{border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 14px;cursor:pointer;font-weight:700;font-family:var(--f-display);font-size:1.05rem;display:flex;gap:8px;align-items:center}
.wfb .c{font-family:var(--f-mono);font-size:.75rem;font-weight:500;color:var(--muted)}
.wfb[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:var(--on-teal)}
.wfb[aria-pressed="true"] .c{color:var(--on-teal)}
.wfb.done{border-color:var(--ok)}
.arrow{color:var(--muted);font-weight:700}
.fstep{display:grid;grid-template-columns:28px 44px minmax(0,1fr);gap:4px 12px;padding:12px 4px;border-top:1px solid var(--line);align-items:start}
.fstep.dim{opacity:.45}
.fstep input{width:22px;height:22px;accent-color:var(--teal);margin-top:2px}
.fstep .n{font-family:var(--f-mono);color:var(--muted);padding-top:2px}
.fstep b{font-size:1.05rem}
.fstep .r{font-size:.85rem;color:var(--ok);font-weight:600}

mated range pending review.", "result": "Firm quote or range", "row": 12}, {"n": "08", "stage": "Price by agreement", "do": "Use current OWNER-APPROVED rate card; price roofline plus minis, stakes, wreaths and special access separately. Explain seasonal scope and term before presenting total.", "result": "Seasonal quote ready", "row": 13}, {"n": "09", "stage": "Explain agreement", "do": "Explain that the standard multi-year plan allows the company to invest in custom-fit materials up front and return for subsequent seasons. Check current term and cancellation exception.", "result": "Terms understood", "row": 14}, {"n": "10", "stage": "Mockup + design", "do": "Use the customer's property photo and one of the THREE AI prompts. Review accuracy; present it as a visual concept, not a field measurement.", "result": "Design attached / shared", "row": 15}, {"n": "11", "stage": "Ask for sale", "do": "“If the design and total work for you, would you like us to reserve an installation date?” If not, find the actual concern and use Objections tab.", "result": "Accepted / objection", "row": 16}, {"n": "12", "stage": "Create quote + next action", "do": "If quote needed: open lead → Convert to Customer → Subscription → create/send estimate. If accepted, follow signed agreement and deposit process. Set owner and exact next step.", "result": "No unowned leads", "row": 17}], "rules": [{"icon": "✓", "case": "Simple visible house", "how": "Measure live, apply verified per-foot price, give a seasonal total while on the phone.", "expect": "Final subject to actual site conditions", "row": 21}, {"icon": "!", "case": "Complex roof or obstructed views", "how": "Give a transparent price range; request better photo or supervisor check BEFORE firm agreement.", "expect": "Don't invent footage / access", "row": 22}, {"icon": "✓", "case": "Customer wants only roofline", "how": "Quote only visible installable requested roof edges. Don't price optional landscaping.", "expect": "Keep quote simple", " ", "action": "Budget fit / expectations", "row": 8}, {"n": "04", "when": "Materials policy", "say": "And just so you know, we install our own professional lights rather than homeowner-supplied lights, so we're able to stand behind the fit and maintenance.", "action": "No customer-supplied lights", "row": 9}, {"n": "05", "when": "Decision-maker", "say": "Before we start, are you the main decision-maker for the Christmas lights, or will someone else also be involved?", "action": "Identify approvals", "row": 10}, {"n": "06", "when": "Property and scope", "say": "What's the full property address, including city and ZIP? Are you mainly thinking roofline, or would you also like bushes, trees, wreaths, garland or walkway lighting?", "action": "Scope + address", "row": 11}, {"n": "07", "when": "Color + timing", "say": "Do you prefer classic warm white, a multicolor pattern, or something else? And about when were you hoping to have everything installed?", "action": "Fixed color / timeline", "row": 12}, {"n": "08", "when": "Design consultation", "say": "We can pull up your home using online property images and create a customized mockup of what it could look like. We'll design around your style and budget, then adjust anything you want changed.", "action": "Permission to show concept", "row": 13}, {"n": "09", "when": "Measure while on call", "say": "While we're talking, I'm going to check the roofline areas you want lit using our aerial measuring process. That gives us a starting point for the price without having to book a separate measurement visit.", "action": "Follow measuring SOP", "row": 14}, {"n": "10", "when": "Present preliminary price", "say": "Based on the roofline and areas we just discussed, the seasonal price is approximately $____. That includes the company-provided lights, installation, standard in-season maintenance, removal and storage. [If measurement is verified: ‘I can prepare the formal quote from this.’]", "action": "Don't call range a firm price", "row": 15}, {"n": "11", "when": "Explain 3-year model", "say": "Our standard 3-year option is designed so we invest in the custom-cut materials for your house the first season, then come back for the next two seasons to reinstall and take everything down. It helps us offer a competitive seasonal rate.", "action": "Explain, don't pressure", "row": 16}, {"n": "12", "when": "If price is too high", "say": "I completely understand. We can simplify the design—maybe prioritize the front roofline first—and build something that fits more comfortably without compromising how neatly it's installed.", "action": "Ask target budget", "row": 17}, {"n": "13", "when": "Mockup reveal", "say": "I have a design concept showing the lighting on your property. What do you like most about it, and is there anything you'd change?", "action": "Listen before talking", "row": 18}, {"n": "14", "when": "Close the sale", "say": "If you love the design and the price works for you, would you like us to move forward with the agreement and get your installation scheduled?", "action": "Ask directly", "row": 19}, {"n": "15", "when": "When accepted", "say": "Perfect! I'll confirm the details, send over your seasonal agreement and payment information, and we can reserve your spot once the required steps are completed.", "action": "FLYRA customer + subscription", "row": 20}, {"n": "16", "when": "If not ready", "say": "No problem. Is it the design, the investment, or the agreement length you're still thinking about? Let's make sure I have the right information for you.", "action": "Record genuine concern", "row": 21}, {"n": "17", "when": "End call", "say": "What works best for our next step—reviewing the revised design, completing the agreement, or reconnecting at [specific day/time]? I'll confirm the details by text.", "action": "Set exact next step", "row": 22}], "never": ["Exact final footage from an unclear satellite view", "Any color not in inventory", "Special installation method on a roof not inspected", "Zero cancellation charges regardless of agreement", "A date that has not been reserved"], "neverRow": 25}, "fast": {"sheet": "03 FAST QUOTES", "title": "FAST PHONE QUOTING  |  NO SEPARATE CALCULATOR", "sub": "Goal: quote routine roofs on the first call. Rate card is a management reference—confirm rates before reps start selling.", "routine": [{"n": "1", "action": "Confirm address", "how": "Ask for full street address, town and ZIP; match the exact house using street view/property image.", "stop": "If wrong property", "row": 6}, {"n": "2", "action": "Pick scope", "how": "Ask: front roofline, entire accessible roofline, garages/peaks, or full-property? Only price sections they approve.", "stop": "If customer unsure, offer 2 scope options", "row": 7}, {"n": "3", "action": "Open measuring tool", "how": "Use the company's chosen aerial roofline tool (e.g., Measured Bid or LightQuoter) or Google Earth manual tracing. Keep it open alongside FLYRA.", "stop": "If no usable imagery", "row": 8}, {"n": "4", "action": "Trace installable lines", "how": "Trace each gutter, peak and garage edge requested. Do not include roof planes, duplicate edges or impossible/unseen sections.", "stop": "If slope or access uncertain", "row": 9}, {"n": "5", "action": "Check difficult conditions", "how": "Check number of stories, steep peaks, metal/fragile roofs, ladder placement, big trees, outlet availability and roofline access.", "stop": "High/difficult roof → review", "row": 10}, {"n": "6", "action": "Price with rate card", "how": "Multiply measured length by approved rate for selected term. Add minis/stakes/wreaths or special labor as separate items. Avoid undisclosed add-ons.", "stop": "If rates not approved", "row": 11}, {"n": "7", "action": "Quote with confidence level", "how": "Reliable image + uncomplicated access: present quote now. Unreliable measurement: present labeled preliminary range and arrange verification before finalizing.", "stop": "Don't guarantee risky footage", "row": 12}, {"n": "8", "action": "Close and capture", "how": "Recap design + seasonal total + plan. Ask to proceed; when quote needed use Convert to Customer → Subscription in FLYRA.", "stop": "Customer decision + next step", "row": 13}], "rates": [{"term": "2-year", "roof": "$10 / linear foot", "mini": "$50 / strand", "stake": "$7 / linear foot", "row": 17}, {"term": "3-year", "roof": "$8 / linear foot", "mini": "$50 / strand", "stake": "$7 / linear foot", "row": 18}, {"term": "4-year", "roof": "$7 / linear foot", "mini": "$50 / strand", "stake": "$6 / linear foot", "row": 19}], "rateNote": "Reference prices from the existing Edge Shines plan; verify active package rates, minimums, add-ons, discounts, taxes, agreement terms, and promotional exceptions before quoting. This is NOT an automatic price calculator.", "checkpoint": [{"verify": "Measurements match design", "why": "Avoid pricing 100 feet while depicting 160 feet.", "action": "Compare traced sections to mockup", "row": 24}, {"verify": "Single fixed color confirmed", "why": "Color must be available and not app-changeable.", "action": "Confirm bulb stock or lead time", "row": 25}, {"verify": "Seasonal package scope", "why": "Company provides lights; install, maintenance, removal, storage included as agreed.", "action": "Say inclusions", "row": 26}, {"verify": "Material and add-on count", "why": "Trees, shrubs, stakes, wreaths, garland, wiring, access surcharge if applicable.", "action": "Don't bury extras", "row": 27}, {"verify": "Deposit + agreement", "why": "Current policy is usually 50% deposit; terms and tax depend on agreement.", "action": "Confirm current approved terms", "row": 28}, {"verify": "FIRM vs PRELIMINARY", "why": "Unknown steep/high roof, imagery blocked, unsafe access or disputed measurements.", "action": "Escalate before firm price", "row": 29}], "cantVerify": "“From the images and the design you're looking for, I expect the seasonal price to be around $___–$___. I want to verify one roof section before promising a fixed price, so there aren't any surprises.”"}, "facts": {"sheet": "04 SERVICE FACTS", "title": "SERVICE & PRODUCT KNOWLEDGE  |  QUICK ANSWERS", "sub": "Use these facts when customers ask what they are buying. Do not substitute broad promises for the signed service agreement.", "items": [{"topic": "Product type", "say": "Commercial-grade C9 LED Christmas lights on customized socket line. Use ‘C9 LED’ when the customer asks what type.", "check": "Bulb style available in stock", "row": 6}, {"topic": "Seasonal vs permanent", "say": "These are professionally installed seasonal holiday lights—not permanent, phone-controlled color-changing lighting.", "check": "Do not imply app control", "row": 7}, {"topic": "Colors", "say": "Customers can choose from available fixed colors or fixed multi-color patterns. Black and gray are not offered.", "check": "Confirm specific color availability", "row": 8}, {"topic": "Can colors change?", "say": "No. The installed bulb colors remain what the customer selects. Changing colors requires replacing/reworking bulbs rather than tapping an app.", "check": "Explain prior to selling", "row": 9}, {"topic": "Client supplies lights?", "say": "No. Edge Shines does not install homeowner-provided light strings or bulbs.", "check": "Company-supplied only", "row": 10}, {"topic": "Custom fit", "say": "We measure, custom-cut and splice socket line to the home's approved roofline so there aren't stray bulbs dangling past edges.", "check": "Exact installable footprint", "row": 11}, {"topic": "Spacing", "say": "Typical roofline presentation uses approximately 15-inch spacing unless the approved design specifies otherwise.", "check": "Confirm stock line spacing", "row": 12}, {"topic": "Roofline coverage", "say": "Follow installable gutters, roof peaks, gables, garage edges and other approved lines; don't add lines where there are no secure mounting options.", "check": "Access review", "row": 13}, {"topic": "Bushes and trees", "say": "Mini lights can wrap approved shrubs/trees; quote by strand or project using approved material quantities.", "check": "Count separately", "row": 14}, {"topic": "Ground lighting", "say": "Ground stakes can border an approved driveway or walkway; quote lengths separately.", "check": "Snow / plow exposure", "row": 15}, {"topic": "Wreaths / garland", "say": "Available as separate custom-design add-ons when quoted and in stock.", "check": "Size, lights, wiring, mount", "row": 16}, {"topic": "Mockup accuracy", "say": "AI mockups illustrate a proposal; architecture must remain the same and only the selected areas should be lit.", "check": "Mockup is not measurement", "row": 17}, {"topic": "In-season upkeep", "say": "Standard service includes maintenance of company-installed lights during the contracted season, subject to agreement exclusions.", "check": "Third-party damage exclusions", "row": 18}, {"topic": "Takedown", "say": "Edge Shines returns to professionally remove the seasonal setup after the holiday period.", "check": "Seasonal calendar", "row": 19}, {"topic": "Storage", "say": "The company stores its lighting and materials for the next applicable season.", "check": "Company owns materials", "row": 20}, {"topic": "Who owns the lights?", "say": "Company-provided bulbs, wires, clips, timers and decorations remain company property unless the signed agreement expressly differs.", "check": "Don't promise ownership transfer", "row": 21}, {"topic": "Timer", "say": "Timers / controls may be installed as part of the service; operation depends on the specific selected product.", "check": "Check schedule and sensor", "row": 22}, {"topic": "Electrical setup", "say": "We need appropriate power access. Additional wiring/outlet needs may affect the plan.", "check": "Do not promise new circuits", "row": 23}, {"topic": "Deposit", "say": "Standard program uses a 50% deposit to reserve a season; balance is generally due upon completed installation.", "check": "Check current agreement", "row": 24}, {"topic": "Agreement term", "say": "The standard 3-year plan returns in years 2 and 3; 2- and 4-year options may be available at approved pricing.", "check": "Confirm chosen option", "row": 25}, {"topic": "Reason for multi-year", "say": "Most custom material and initial setup investment occurs in the first season, so later seasons are important for sustainable pricing.", "check": "Do not claim exact losses", "row": 26}, {"topic": "Early cancellation", "say": "Your typical policy uses a fee of 40% of that year's seasonal bill for applicable early cancellation, to offset custom materials. Agreement exceptions control.", "check": "Confirm actual signed terms", "row": 27}, {"topic": "Competitor comparison", "say": "Explain the full-service value and competitive pricing objectives, not unverified claims of being the cheapest.", "check": "No unsupported ranking", "row": 28}, {"topic": "Typical home price", "say": "Use around $1,000 per season as a general expectation setter—not a guaranteed minimum, maximum or fixed house quote.", "check": "Actual price by design", "row": 29}, {"topic": "Roof safety", "say": "Use approved attachment methods based on roof/siding material. Never promise staples, glue, magnets or no damage without reviewing conditions.", "check": "Escalate unusual roof materials", "row": 30}]}, "obj": {"sheet": "05 OBJECTIONS", "title": "OBJECTION FINDER  |  SELECT A QUESTION", "sub": "Choose an objection in B4 to bring its answer to the top. Full answer bank is below; adjust terms to the customer's signed agreement.", "items": [{"says": "I don't want a 3-year agreement", "answer": "I understand. We aim to offer competitive full-service pricing. In year one we buy the lights, custom-cut and splice everything to your home, and complete the initial setup—so that first season carries most of our material costs. The later seasons are how we make the multi-year service sustainable. We return each year to install, maintain, remove and store everything.", "next": "Would you like me to show what the different approved agreement lengths look like?", "row": 11}, {"says": "What if I cancel in the second year?", "answer": "For agreements with our standard early-cancellation clause, the fee is 40% of that year's seasonal bill. It helps recover the cost of materials already custom-fit to your home. I can show you the exact wording before you sign; any promotional exception in your signed agreement takes precedence.", "next": "Would you like me to send the specific cancellation section for review?", "row": 12}, {"says": "Why can't I do one year?", "answer": "Our standard business model is based on multiple seasons because the first-year custom materials and installation are the largest investment. I can review whether a shorter option or one-time custom quote is currently approved.", "next": "Should I check the options for your property?", "row": 13}, {"says": "Is $1,000 the price for my house?", "answer": "That's the approximate price of an average seasonal home, not a universal quote. Your total depends on roofline footage, access, the design and any add-ons. I can measure the requested sections with you now.", "next": "Is roofline-only your priority?", "row": 14}, {"says": "It's too expensive", "answer": "I understand. We supply professional lights, custom-fit the lines, install, provide maintenance, then remove and store everything. We can simplify the design—often starting with the front roofline—to bring the total closer to your goal.", "next": "What total would you be more comfortable with?", "row": 15}, {"says": "Other companies are cheaper", "answer": "That may be true for a different scope. Our quote includes the custom-fit company-owned C9 lights, professional setup, seasonal upkeep, takedown and storage. Let's compare what's included rather than only the headline number.", "next": "Do you know whether their quote includes removal and storage?", "row": 16}, {"says": "What kind of lights are they?", "answer": "We use commercial-grade C9 LED holiday lights on custom-cut socket line, designed for a clean and uniform roofline.", "next": "Would you prefer warm white or another fixed color?", "row": 17}, {"says": "Can the lights change colors?", "answer": "The seasonal C9 lights we quote are fixed-color bulbs, not an app-controlled color-changing system. You can choose an approved single color or fixed multicolor layout when we design it.", "next": "Which fixed look do you prefer?", "row": 18}, {"says": "What colors can I choose?", "answer": "We can work with the available C9 colors and fixed patterns, other than black or gray. I'll confirm stock before promising an exact color combination.", "next": "Do you want classic warm white, multicolor or a specific pattern?", "row": 19}, {"says": "Will the lights hang over my roof?", "answer": "No loose extra bulbs are part of the plan. We custom-cut and splice the roofline runs to fit the approved edges and install them as neatly as the roof permits.", "next": "Can we focus on the visible front edges first?", "row": 20}, {"says": "Can you hang lights I already own?", "answer": "We don't install homeowner-provided lights. Using our own commercial-grade materials lets us custom-fit the layout and manage maintenance consistently.", "next": "Would you like a quote for our done-for-you service?", "row": 21}, {"says": "Who owns the lights after installation?", "answer": "Edge Shines retains ownership of the company-provided lights and related materials under our standard service agreement; we store them for upcoming seasons.", "next": "Would you like to review the service-inclusions section?", "row": 22}, {"says": "Do you store them for me?", "answer": "Yes. Seasonal removal and storage of our company-provided lighting are included in the standard full-service program.", "next": "Would you like the roofline taken down at the standard seasonal time?", "row": 23}, {"says": "What if a bulb goes out?", "answer": "Let us know and we'll address covered maintenance issues during the season under the agreement. Damage from third parties or equipment can have different treatment.", "next": "Can I confirm the best contact number for service?", "row": 24}, {"says": "Can I get roofline only?", "answer": "Absolutely. Roofline-only is a great clean design, and we can cover as much of the visible installable front roofline as you'd like within your budget.", "next": "Should I include the garage and front peaks?", "row": 25}, {"says": "Can you do the trees and bushes?", "answer": "Yes, we can quote minis on selected shrubs and trees as add-ons. We'll estimate the strand count separately from the roofline.", "next": "Which plants do you want included?", "row": 26}, {"says": "I need to ask my spouse", "answer": "Of course. I'd be happy to send the design and price so you're both looking at the same option, then we can answer any questions together.", "next": "When would both of you be available for five minutes?", "row": 27}, {"says": "I need to think about it", "answer": "Absolutely. Is the main thing you're considering the total price, how the design looks, or the agreement length? I want to send you the information that's actually useful.", "next": "What would help you decide?", "row": 28}, {"says": "Just send me pricing", "answer": "Happy to. The accurate way is to confirm the property, the sections you'd like lit, and the seasonal agreement. I can often get you a number while we're speaking.", "next": "What's the full address?", "row": 29}, {"says": "I don't have time right now", "answer": "No problem. We only need a few minutes for the consultation. Let's choose a time that works so we can discuss exactly what you want.", "next": "Would later today or tomorrow be better?", "row": 30}, {"says": "Can you guarantee the exact mockup?", "answer": "The mockup shows the intended design, but actual lighting will follow installable roof edges and real conditions. We review it for accuracy before finalizing.", "next": "Which e d the agreement and payment steps?", "row": 38}], "policy": "POLICY NOTE  •  Check signed cancellation terms, promotional exceptions, current rates and inventory; do not guarantee costs, dates or materials without verification."}, "mock": {"sheet": "06 AI MOCKUPS", "title": "AI MOCKUP SOP  |  ONLY 3 PROMPTS", "sub": "Attach a clear image of the customer's actual property. Copy the entire prompt from the appropriate cell; do not invent the building or lighting locations.", "steps": [{"step": "1  Select photo", "do": "Use the best clear front/street-facing home photo from the customer, Maps, Zillow or another legitimate property view. Check that it is the right property.", "rule": "Clear front roofline", "row": 6}, {"step": "2  Choose 1 of 3 prompts", "do": "Whole-property concept, maximum front roofline, or a specific revision. Replace bracketed items like [COLOR] before pasting.", "rule": "No extra prompts needed", "row": 7}, {"step": "3  Submit photo + prompt", "do": "Upload the property photo to the image AI and paste the selected template verbatim. If the tool supports marking exact edges, mark them first.", "rule": "Use source photo", "row": 8}, {"step": "4  Verify before sending", "do": "Compare original and result. Check roof edges, missing/extra lights, door/window changes, landscaping, bulb spacing, floating lines and unrealistic installation.", "rule": "Reject inaccurate mockups", "row": 9}, {"step": "5  Explain to customer", "do": "“Here's a design concept for your home. We’ll verify the actual installation areas and measurements before treating it as the final scope.”", "rule": "Not a measuring tool", "row": 10}], "prompts": [{"label": "PROMPT 1\nBEST POSSIBLE DESIGN", "text": "Edit the ATTACHED PHOTO of this exact property. Create the most attractive, high-impact, professionally installable Christmas lighting design realistically possible for the visible property. Use commercial-grade C9 LED holiday lights with a fixed [COLOR OR COLOR PATTERN] color sche he following specific changes: [DESCRIBE EXACT CHANGES, e.g., remove lights from left bushes; add one 24-inch warm-white wreath with red bow over center window; keep roofline lights unchanged]. Follow any user-marked red lines or circles exactly. Preserve every existing light and decoration NOT explicitly mentioned, including current color, spacing, placement and glow. Do not add any new lights or decorations outside the requested changes. Keep the architecture, landscaping, perspective and nighttime lighting exactly the same. Make all remaining light runs neat, correctly attached and realistic. If a requested surface is unclear or physically inaccessible, leave it unchanged instead of inventing one.", "use": "Changes only\nNo redesign", "row": 16}], "final": "FINAL CHECK  •  Does the AI design match the customer's measured scope, fixed-color selection and the home's actual roofline? If not, correct it before sending."}, "flyra": {"sheet": "07 FLYRA SOP", "title": "FLYRA SOP  |  LEAD → CUSTOMER → SUBSCRIPTION", "sub": "This is the Edge Shines internal workflow requested for FLYRA. Use the equivalent current menu labels if the interface changes.", "steps": [{"n": "01", "action": "Open original lead", "detail": "Search by customer name or number; review latest call/text notes; don't create a duplicate.", "result": "Existing record", "row": 6}, {"n": "02", "action": "Confirm customer fields", "detail": "Full name, phone, email if available, address including city/ZIP, property notes, source, decision-maker.", "result": "Complete profile", "row": 7}, {"n": "03", "action": "Document scope", "detail": "Roofline sections, footage and reliability, C9 colors, add-ons, design image, agreement option and anticipated installation date.", "result": "Ready to quote", "row": 8}, {"n": "04", "action": "CLICK: CONVERT TO CUSTOMER", "detail": "When a quote is required, click Convert to Customer on the lead record.", "result": "Customer created", "row": 9}, {"n": "05", "action": "CHOO count wrapped passes.", "rule": "Record lit/unlit, powered/battery, fullness, height. Pricing is owner-approved per item or foot.", "row": 10}, {"n": "08", "area": "Check installability", "measure": "Look for steep metal roofs, fragile surfaces, overhead wires, tall peaks, inaccessible gutters and power access.", "rule": "Escalate hard/uncertain install sections before a firm price.", "row": 11}, {"n": "09", "area": "Give price on call", "measure": "Use the approved price card and chosen agreement. Roofline + ground-stake ft, plus counted mini strands and greenery items.", "rule": "Give firm quote only when measurements, access and materials are verified; otherwise label preliminary.", "row": 12}, {"n": "10", "area": "Present & close", "measure": "Repeat covered areas and total seasonal price, show a matching mockup, and ask to proceed.", "rule": "In FLYRA: Convert to Customer → Subscription → quote; record call notes and next action.", "row": 13}], "checklist": ["Address matches visible property", "Desired lighting areas confirmed", "Both sides of driveway counted if requested", "Roofline segments not double-counted", "Bush/tree coverage and count noted", "Greenery sizes and wiring recorded", "Difficult access or roofs flagged", "Mockup matches the measured areas", "Chosen term, tax, discounts approved"], "script": "“I can check your home from aerial imagery while we’re on the phone. I’ll measure just the sections you want, price the roofline and any landscaping separately, and give you the seasonal estimate. If a roof section isn’t clear or safe to verify remotely, I’ll let you know before confirming a final price.”"}, "price": {"sheet": "10 PRICE CARD", "title": "LIGHTING RATE CARD · OWNER APPROVAL REQUIRED", "sub": "Previously used Edge Shines rates below are reference prices—not a guarantee. Confirm active season/terms, discounts, inventory and tax before quoting.", "rates": [{"term": "2-year", "roof": 10, "mini": 50, "stake": 7, "row": 4}, {"term": "3-year", " <script>
/* Edge Shines Sales Assistant. All business content comes from DATA (extracted verbatim from the playbook workbook). */
(function () {
  'use strict';
  const D = DATA;
  const $ = (s, r) => (r || document).querySelector(s);
  const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const money = n => '$' + (Math.round(n * 100) / 100).toLocaleString('en-US', { minimumFractionDigits: n % 1 ? 2 : 0, maximumFractionDigits: 2 });
  const store = {
    get(k, d) { try { const v = localStorage.getItem('es-' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem('es-' + k, JSON.stringify(v)); } catch (e) { /* storage unavailable */ } }
  };
  const ICON_COPY = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>';

  /* ---------- Rep name ---------- */
  let repName = store.get('rep', '');
  const rep = t => (repName ? String(t).replace(/\bEmily\b/g, repName) : String(t));

  /* ---------- Source helpers ---------- */
  const SH = { sop: D.sop.sheet, script: D.script.sheet, fast: D.fast.sheet, facts: D.facts.sheet, obj: D.obj.sheet, mock: D.mock.sheet, flyra: D.flyra.sheet, texts: D.texts.sheet, measure: D.measure.sheet, price: D.price.sheet };
  const src = (k, row, section) => esc(SH[k]) + (section ? ' › ' + esc(section) : '') + (row ? ' · Row ' + row : '');
  const by = (arr, row) => arr.find(x => x.row === row);
  const sop = r => by(D.sop.steps, r), scr = r => by(D.script.lines, r), rule = r => by(D.sop.rules, r);
  const obj = r => by(D.obj.items, r), txt = r => by(D.texts.items, r), meas = r => by(D.measure.steps, r);
  const fr = r => by(D.fast.routine, r), mk = r => by(D.mock.steps, r), fl = r => by(D.flyra.steps, r);
  const fact = t => D.facts.items.find(x => x.topic === t);
  const rateFor = term => D.price.rates.find(r => r.term === term);

  /* ---------- Copy registry ---------- */
  let reg = new Map(), regN = 0;
  const copyKey = fn => { const k = 'c' + (++regN); reg.set(k, fn); return k; };
  const copyBtn = (textOrFn, label, cls) => {
    const fn = typeof textOrFn === 'function' ? textOrFn : () => rep(textOrFn);
    return `<button type="button" class="btn sm ${cls || ''}" data-copy="${copyKey(fn)}">${ICON_COPY}<span>${esc(label || 'Copy')}</span></button>`;
  };
  function doCopy(btn) {
    const fn = reg.get(btn.dataset.copy); if (!fn) return;
    const text = fn(); if (text == null) return;
    const done = ok => {
      if (!ok) { toast('Copy was blocked. Select the text and press Ctrl+C.'); return; }
      const span = btn.querySelector('span'), old = span ? span.textContent : '';
      btn.classList.add('copied'); if (span) span.textContent = 'Copied';
      setTimeout(() => { btn.classList.remove('copied'); if (span) span.textContent = old; }, 1400);
      if (/\[[^\]]+\]|\$_{2,}/.test(text)) toast('Copied. Fill in the [bracketed] blanks before sending.');
      else toast('Copied to clipboard');
    };
    const fallback = () => {
      try {
        const ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', '');
        ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select();
        const ok = document.execCommand('copy'); ta.remove(); done(ok);
      } catch (e) { done(false); }
    };
    try { navigator.clipboard.writeText(text).then(() => done(true), fallback); } catch (e) { fallback(); }
  }
  let toastT;
  function toast(m) { const t = $('#toast'); t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 2200); }

  /* ---------- Shared render pieces ---------- */
  const sayBlock = (label, text, srcHtml, opt) => {
    opt = opt || {};
    return `<div class="say ${opt.big ? 'big' : ''}" ${opt.id ? `id="${opt.id}"` : ''}>
      <div class="lbl"><b>${esc(label)}</b>${copyBtn(text)}</div>
      <q>${esc(rep(text))}</q>
      ${(opt.after || srcHtml) ? `<div class="meta">${opt.after ? `<span class="small muted">${opt.after}</span>` : '<span></span>'}<span class="src">${srcHtml || ''}</span></div>` : ''}
    </div>`;
  };

  IDX.forEach(e => {
    e.tt = tokens(e.title); e.tk = tokens(e.kw || ''); e.tb = tokens([e.main].concat((e.fields || []).map(f => f[1])).join(' '));
    e.all = new Set(e.tt.concat(e.tk, e.tb));
    e.normTitle = norm(e.title).replace(/[^a-z0-9 ]+/g, ' ').replace(/\s+/g, ' ');
  });
  const DF = {}; IDX.forEach(e => e.all.forEach(t => { DF[t] = (DF[t] || 0) + 1; }));
  const N = IDX.length;

  function search(q) {
    const qt = Array.from(new Set(tokens(q)));
    if (!qt.length) return { qt, res: [] };
    const nq = norm(q).replace(/[^a-z0-9 ]+/g, ' ').replace(/\s+/g, ' ').trim();
    const res = [];
    IDX.forEach(e => {
      let score = 0, matched = 0;
      qt.forEach((t, i) => {
        const idf = Math.log(1 + N / (DF[t] || 0.5));
        let w = 0;
        if (e.tt.includes(t)) w = 3; else if (e.tk.includes(t)) w = 2.2; else if (e.tb.includes(t)) w = 1;
        else if (t.length >= 3 && i === qt.length - 1) { // partial last word while typing
          if (e.tt.some(x => x.startsWith(t))) w = 1.6; else if (e.tb.some(x => x.startsWith(t))) w = 0.6;
        }
        if (w) { matched++; score += w * idf; }
      });
      if (!matched) return;
      const cov = matched / qt.length;
      score *= (0.25 + 0.75 * cov * cov);
      if (nq.length > 3 && e.normTitle.includes(nq)) score *= 1.6;
      score *= (e.boost || 1);
      res.push({ e, score, cov });
    });
    res.sort((a, b) => b.score - a.score);
    const top = res.length ? res[0].score : 0;
    return { qt, res: res.filter(r => r.score >= top * 0.18).slice(0, 14) };
  }
  const hl = (text, qset) => esc(rep(text)).replace(/[A-Za-z0-9$’']+/g, (w, off, str) => {

    const t = norm(w).replace(/[^a-z0-9]/g, ''); if (!t || STOP.has(t)) return w;
    const st = stem(NUMW[t] || t); const c = CANON[st] || st;

  /* ---------- Estimator ---------- */
  const EST_DEFAULT = () => ({ term: '3-year', roof: [{ label: 'Front roofline', ft: 120 }], bush: [{ label: 'Front bushes', count: 3, per: 5 }], tree: [], stake: [{ label: 'Front walk', ft: 60 }], wreath: [], garland: [], labor: [], flags: {}, checks: {}, mchecks: {}, example: true });
  const EST_EMPTY = () => ({ term: '3-year', roof: [{ label: 'Front roofline', ft: '' }], bush: [], tree: [], stake: [], wreath: [], garland: [], labor: [], flags: {}, checks: {}, mchecks: {}, example: false });
  let est = store.get('est', null) || EST_DEFAULT();
  const FLAGS_EST = [
    ['steep', 'Steep, hidden or sloped roof sections (rake length unclear)', src('measure', 5)],
    ['metal', 'Metal, aluminum or fragile roof — attachment review', src('facts', 30)],
    ['high', 'High roof, tall peaks or second-story access', src('measure', 11)],
    ['tree', 'Large, tall or dense trees — crew review', src('measure', 7)],
    ['power', 'Power access / outlets uncertain', src('facts', 23)],
    ['image', 'Imagery unclear or roof not fully visible', src('fast', 29)]
  ];
  const num = v => { const n = parseFloat(v); return isFinite(n) && n > 0 ? n : 0; };
  function estCalc(e, term) {
    const r = rateFor(term || e.term);
    const lines = [], missing = [];
    const roofFt = e.roof.reduce((s, x) => s + num(x.ft), 0);
    if (roofFt) lines.push([`Roofline C9: ${roofFt} ft × $${r.roof}`, roofFt * r.roof]);
    const bs = e.bush.reduce((s, x) => s + num(x.count) * num(x.per), 0);
    if (bs) lines.push([`Bushes · minis: ${bs} strands × $${r.mini}`, bs * r.mini]);
    const ts = e.tree.reduce((s, x) => s + num(x.count) * num(x.per), 0);
    if (ts) lines.push([`Trees · minis: ${ts} strands × $${r.mini}`, ts * r.mini]);
    const sf = e.stake.reduce((s, x) => s + num(x.ft), 0);
    if (sf) lines.push([`Ground stakes: ${sf} ft × $${r.stake}`, sf * r.stake]);
    e.wreath.forEach(x => { const q = num(x.qty); if (!q) return; if (num(x.rate)) lines.push([`Wreath ${x.size}-in × ${q} @ ${money(num(x.rate))} (manager rate)`, q * num(x.rate)]); else missing.push(`Wreath ${x.size}-in × ${q}`); });
    e.garland.forEach(x => { const q = num(x.qty); if (!q) return; const u = x.unit === 'section' ? 'section' : 'ft'; if (num(x.rate)) lines.push([`Garland ${x.label || ''} ${q} ${u} @ ${money(num(x.rate))}/${u} (manager rate)`.replace(/\s+/g, ' '), q * num(x.rate)]); else missing.push(`Garland ${x.label || ''} ${q} ${u}`.replace(/\s+/g, ' ')); });
    e.labor.forEach(x => { if (num(x.amt)) lines.push([`Approved surcharge: ${x.label || 'labor / access'}`, num(x.amt)]); else if ((x.label || '').trim()) missing.push(`Surcharge: ${x.label}`); });
    const total = lines.reduce((s, l) => s + l[1], 0);
    return { r, lines, missing, total, roofFt, bs, ts, sf };
  }
  function estStatus(c) {
    const reasons = [];
    FLAGS_EST.forEach(([k, l]) => { if (est.flags[k]) reasons.push('Escalate: ' + l); });
    if (c.missing.length) reasons.push('Rate needed: ' + c.missing.join(', '));
    const unchecked = D.fast.checkpoint.filter(x => !est.checks[x.row]).length;
    if (unchecked) reasons.push(`${unchecked} of ${D.fast.checkpoint.length} quote checkpoints not verified`);
    if (!c.total) reasons.push('Nothing priced yet');
    return { firm: !reasons.length, reasons };
  }
  const ln = (kind, i, cells) => `<div class="ln ${kind}">${cells}<button class="x" data-del="${kind}.${i}" aria-label="Remove line">×</button></div>`;
  const inp = (path, val, ph, type, extra) => `<input id="e-${path.replace(/\./g, '-')}" data-est="${path}" ${type === 'n' ? 'type="number" inputmode="decimal" min="0" step="any"' : 'type="text"'} value="${esc(val == null ? '' : val)}" placeholder="${esc(ph || '')}" ${extra || ''} aria-label="${esc(ph || path)}">`;
  function vEst() {
    const r = rateFor(est.term);
    const comp = row => by(D.price.components, row);
    const tool = (title, rateTxt, srcHtml, hdr, rows, addBtn, note, subId) => `<section class="tool"><div class="th"><h3>${title}</h3><span class="rate">${rateTxt}</span></div>
      ${hdr}<div class="lines">${rows || '<span class="small muted">No lines yet.</span>'}</div>
      <div class="row">${addBtn}</div>${note ? `<div class="small muted">${note}</div>` : ''}
      <div class="sub" id="${subId}"></div><span class="src">${srcHtml}</span></section>`;
    const add = (kind, label) => `<button class="btn sm" data-addln="${kind}">+ ${label}</button>`;
    const quick = (kind, labels) => labels.map(l => `<button class="btn sm" data-addln="${kind}" data-label="${esc(l)}">+ ${esc(l)}</button>`).join('');

    const cmp = D.price.rates.map(x => { const cc = estCalc(est, x.term); return `<tr class="${x.term === est.term ? 'on' : ''}"><td>${esc(x.term)}</td><td>${money(cc.total)}</td><td>${money(cc.total * 0.5)}</td></tr>`; }).join('');

      est.tree.filter(x => num(x.count)).forEach(x => L.push(`  Trees: ${x.label || 'trees'} ${num(x.count)} × ${num(x.per)} strands`));

        ${st.firm ? '<span class="small muted">All checkpoints verified, no escalation flags, and every line has a rate.</span>' : `<ul class="small" style="margin:0;padding-left:18px">${st.reasons.map(x => `<li>${esc(x)}</li>`).join('')}</ul>`}

        ${c.missing.length ? `<div class="need">Not in total (rate needed): ${esc(c.missing.join(', '))}</div>` : ''}
        <span class="src">Deposit: ${src('facts', 24)}</span>
      </section>

        <span class="small muted">Use when the customer asks what the approved agreement lengths look like. Confirm the 2- and 4-year options are available.</span></section>

  /* ======================================================================
     EVENTS
     ====================================================================== */
  document.addEventListener('click', e => {
    const t = e.target.closest('button,[data-go],[data-q]'); if (!t) return;
    const d = t.dataset;
    if (d.copy) return doCopy(t);
    if (d.view) return go(d.view);
    if (d.go) return go(d.go, d.step != null ? { step: +d.step } : {});
    if (d.q) { setQuery(d.q); return; }
    if ('clear' in d) { setQuery(''); return; }
    if (d.goto != null) { const r = lastResults[+d.goto]; if (r) go(r.e.go.view, r.e.go); return; }
    if (d.step != null && t.classList.contains('stp')) { flowStep = +d.step; store.set('step', flowStep); render(); return; }
    if (d.stepnav) {
      const dir = +d.stepnav;
      if (dir > 0 && !flowDone.includes(flowStep)) flowDone.push(flowStep);
      if (dir > 0 && flowStep === 11) { toast('Call complete. Make sure the 6 FLYRA facts are recorded.'); }
      flowStep = Math.max(0, Math.min(11, flowStep + dir));
      store.set('step', flowStep); store.set('done', flowDone); render(); window.scrollTo(0, 0); return;
    }
    if ('flowreset' in d) { flowStep = 0; flowDone = []; store.set('step', 0); store.set('done', []); render(); return; }
    if (d.objgo) return go('objections', { obj: +d.objgo });
    if (d.obj) { objSel = +d.obj; render(); if (window.innerWidth < 980) $('#objd').scrollIntoView({ block: 'start' }); return; }
    if (d.cat) { objCatSel = d.cat; const first = D.obj.items.find(o => d.cat === 'All' || objCat[o.row] === d.cat); if (first && d.cat !== 'All') objSel = first.row; render(); return; }
    if (d.term) { est.term = d.term; render(); return; }
    if (d.addln) {
      const k = d.addln, L = d.label || '';
      const blank = { roof: { label: L, ft: '' }, bush: { label: L, count: '', per: 5 }, tree: { label: L, count: '', per: 10 }, stake: { label: L, ft: '' }, wreath: { size: 36, qty: '', rate: '' }, garland: { label: L, qty: '', unit: 'ft', rate: '' }, labor: { label: L, amt: '' } }[k];
      est[k].push(blank); render();
      requestAnimationFrame(() => { const ins = $$(`[data-est^="${k}.${est[k].length - 1}."]`); const el = ins.find(x => !x.value) || ins[0]; if (el) el.focus(); });
      return;
    }
    if (d.del) { const [k, i] = d.del.split('.'); est[k].splice(+i, 1); render(); return; }
    if ('estex' in d) { est = EST_DEFAULT(); render(); toast('Reference example loaded'); return; }
    if ('estclear' in d) { est = EST_EMPTY(); render(); toast('Cleared. Ready for a new customer.'); return; }
    if (d.phase != null) { flyraPhase = flyraPhase === +d.phase ? null : +d.phase; render(); return; }
    if ('freset' in d) { flyraChk = []; flyraNotes = {}; flyraPhase = null; store.set('flyraChk', []); store.set('flyraNotes', {}); render(); toast('FLYRA checklist and notes cleared'); return; }
  });

  document.addEventListener('input', e => {
    const t = e.target, d = t.dataset;
    if (t.id === 'q') { query = t.value; syncClear(); clearTimeout(qT); qT = setTimeout(() => render(), 70); return; }
    if (t.id === 'rep' || t.id === 'rep2') { repName = t.value.trim(); store.set('rep', repName); const o = $(t.id === 'rep' ? '#rep2' : '#rep'); if (o) o.value = t.value; clearTimeout(rT); rT = setTimeout(rerenderKeepFocus, 250); return; }
    if (d.est) {
      const [k, i, f] = d.est.split('.'); est[k][+i][f] = t.value; est.example = false; estRecalc();
      return;
    }
    if (d.fill) {
      fillVals[d.fill] = t.value; store.set('fills', fillVals);
      if (d.all) { $$('[data-tpl^="text:"]').forEach(el => { const row = +el.dataset.tpl.split(':')[1]; el.innerHTML = fillHtml(txt(row).text, 't' + row); }); return; }
      const el = document.getElementById(d.target); if (!el) return;
      const [kind, row] = el.dataset.tpl.split(':');
      el.innerHTML = kind === 'mock' ? fillHtml(by(D.mock.prompts, +row).text, 'p' + row) : fillHtml(txt(+row).text, 't' + row);
      return;
    }
    if (d.fnote) { flyraNotes[d.fnote] = t.value; store.set('flyraNotes', flyraNotes); return; }
    if (t.id === 'objf') { objFilter = t.value; rerenderKeepFocus(); return; }
    if (t.id === 'factf') { factFilter = t.value; rerenderKeepFocus(); return; }
  });
  document.addEventListener('change', e => {
    const t = e.target, d = t.dataset;
    if (d.flag) { est.flags[d.flag] = t.checked; estRecalc(); return; }
    if (d.check) { est.checks[d.check] = t.checked; estRecalc(); return; }
    if (d.mcheck != null) { est.mchecks[d.mcheck] = t.checked; store.set('est', est); return; }
    if (d.est && t.tagName === 'SELECT') { const [k, i, f] = d.est.split('.'); est[k][+i][f] = t.value; estRecalc(); return; }
    if (d.fchk) { const r = +d.fchk; flyraChk = t.checked ? flyraChk.concat(r) : flyraChk.filter(x => x !== r); store.set('flyraChk', flyraChk); const y = window.scrollY; render(); window.scrollTo(0, y); return; }
  });
  let qT, rT;
  function rerenderKeepFocus() {
    const a = document.activeElement, id = a && a.id, s = a && a.selectionStart, y = window.scrollY;
    render(); window.scrollTo(0, y);
    if (id) { const el = document.getElementById(id); if (el) { el.focus(); try { if (s != null) el.setSelectionRange(s, s); } catch (x) { /* not a text field */ } } }
  }
  function setQuery(v) { query = v; $('#q').value = v; syncClear(); render(); window.scrollTo(0, 0); if (v) $('#q').focus(); }
  function syncClear() { $('#qclear').hidden = !query; $('#qkbd').hidden = !!query; }
  $('#qform').addEventListener('submit', e => { e.preventDefault(); render(); });
  document.addEventListener('keydown', e => {
    if (e.key === '/' && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) { e.preventDefault(); $('#q').focus(); $('#q').select(); }
    if (e.key === 'Escape' && document.activeElement.id === 'q' && query) setQuery('');
  });

  /* ---------- Boot ---------- */
  $('#rep').value = repName; $('#rep2').value = repName;
  syncClear();
  render();
})();

</script>
