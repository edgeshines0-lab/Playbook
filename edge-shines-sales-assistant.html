<title>Edge Shines Holiday Lighting Sales Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap">
<style>
/* Layout: evergreen sidebar, sticky search bar, working canvas with a live estimate rail. Edge Shines green on cool white (light) or deep pine (dark). */
:root{
  --bg:#f3f6f4; --surface:#ffffff; --surface-2:#f7faf8; --sunken:#edf2ef; --line:#e1e8e4; --line-2:#cfdad4;
  --fg:#0f1a15; --muted:#5a6a62; --accent:#0f7a4a; --accent-hover:#0b6540; --accent-soft:#e3f3ea; --accent-ink:#0a5a36; --on-accent:#ffffff;
  --side:#0c2118; --side-2:#12301f; --side-fg:#e4efe8; --side-muted:#8ea89a; --side-active:#1c4a33;
  --ok:#137144; --ok-bg:#e2f4e9; --warn:#8a5600; --warn-bg:#fff3d9; --bad:#b42318; --bad-bg:#fdebe9; --info:#2353c0; --info-bg:#e8efff;
  --mark:#ffef9e; --focus:#f2a900;
  --shadow:0 1px 2px rgba(15,26,21,.05),0 6px 16px rgba(15,26,21,.05);
  --shadow-lg:0 18px 50px rgba(8,20,14,.24);
  --f-display:"Manrope","Inter",system-ui,sans-serif; --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px; --r-s:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0a110d; --surface:#111b16; --surface-2:#0e1712; --sunken:#0b130f; --line:#1f2e26; --line-2:#2b3e34;
  --fg:#e6efe9; --muted:#97ab9f; --accent:#3cc282; --accent-hover:#5ad398; --accent-soft:#11301f; --accent-ink:#86e2b4; --on-accent:#04190f;
  --side:#060c09; --side-2:#0d1a13; --side-fg:#dfeae3; --side-muted:#7f978a; --side-active:#163b29;
  --ok:#6fd6a0; --ok-bg:#0f2e1e; --warn:#f0b655; --warn-bg:#33250a; --bad:#ff8a80; --bad-bg:#3a1512; --info:#91b3ff; --info-bg:#15213b;
  --mark:#5c4b00; --focus:#f0b655; --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-lg:0 18px 50px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a110d; --surface:#111b16; --surface-2:#0e1712; --sunken:#0b130f; --line:#1f2e26; --line-2:#2b3e34;
  --fg:#e6efe9; --muted:#97ab9f; --accent:#3cc282; --accent-hover:#5ad398; --accent-soft:#11301f; --accent-ink:#86e2b4; --on-accent:#04190f;
  --side:#060c09; --side-2:#0d1a13; --side-fg:#dfeae3; --side-muted:#7f978a; --side-active:#163b29;
  --ok:#6fd6a0; --ok-bg:#0f2e1e; --warn:#f0b655; --warn-bg:#33250a; --bad:#ff8a80; --bad-bg:#3a1512; --info:#91b3ff; --info-bg:#15213b;
  --mark:#5c4b00; --focus:#f0b655; --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-lg:0 18px 50px rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--surface)}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;line-height:1.15;letter-spacing:-.01em;text-wrap:balance}
h1{font-size:1.75rem;font-weight:800} h2{font-size:1.3rem;font-weight:800} h3{font-size:1.05rem;font-weight:700}
p{margin:0} button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 2px}
kbd{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.8em;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--surface)}
.tnum{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:.85rem} .block{display:block}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center} .row.between{justify-content:space-between} .row.center{justify-content:center}
.stack{display:flex;flex-direction:column;gap:14px;min-width:0} .stack-s{display:flex;flex-direction:column;gap:8px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px;align-items:start}
.eyebrow{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--accent-ink)}
.eyebrow.mt{margin-top:10px}
.src{font-size:.72rem;color:var(--muted);letter-spacing:.01em}
.okc{color:var(--ok)} .warnc{color:var(--warn)} .bad-t{color:var(--bad)}
.ic{flex:none}

/* App shell */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:var(--side);color:var(--side-fg);display:flex;flex-direction:column;gap:6px;padding:20px 14px 16px;overflow:auto;z-index:40;
  padding-left:max(14px,env(safe-area-inset-left,0px))}
.brand{background:none;border:0;text-align:left;cursor:pointer;color:inherit;padding:4px 10px 18px;display:flex;flex-direction:column;gap:4px}
.brand .b1{font-family:var(--f-display);font-weight:800;font-size:1.25rem;letter-spacing:.14em}
.brand .b2{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--side-muted);line-height:1.35}
.navlist{display:flex;flex-direction:column;gap:3px}
.navi{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;color:var(--side-fg);padding:10px 12px;border-radius:10px;cursor:pointer;font-size:.95rem;text-align:left;position:relative}
.navi:hover{background:var(--side-2)}
.navi[aria-current="page"]{background:var(--side-active);font-weight:600}
.navi[aria-current="page"] .ic{color:var(--accent)}
.navi .nb{margin-left:auto;min-width:20px;height:20px;border-radius:10px;background:var(--bad);color:#fff;font-size:.72rem;font-weight:700;display:grid;place-items:center;padding:0 6px}
.navi .nb.warn{background:#d98f00}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding:14px 8px 0;border-top:1px solid var(--side-2)}
.sync{display:flex;gap:8px;align-items:center;font-size:.8rem;color:var(--side-muted)} .sync.ok .ic{color:var(--accent)}
.who{display:flex;gap:10px;align-items:center;font-size:.9rem}
.av{width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-weight:700;font-size:.85rem}
.who-in{display:flex;flex-direction:column;gap:4px;font-size:.75rem;color:var(--side-muted)}
.who-in .inp{background:var(--side-2);border-color:var(--side-2);color:var(--side-fg)}
.scrim{display:none}
.body{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;gap:14px;align-items:center;padding:12px 28px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
  padding-right:max(28px,env(safe-area-inset-right,0px))}
.menu-btn{display:none!important}
.tsearch{position:relative;flex:1;max-width:760px;display:flex;align-items:center}
.tsearch>.ic{position:absolute;left:14px;color:var(--muted)}
.tsearch .inp{height:46px;padding-left:42px;border-radius:12px;background:var(--surface);font-size:.98rem}
.tsugg{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-lg);padding:6px;display:flex;flex-direction:column;z-index:50;max-height:70vh;overflow:auto}
.tsugg button{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;text-align:left;border:0;background:none;padding:10px;border-radius:8px;cursor:pointer}
.tsugg button:hover{background:var(--surface-2)}
.tsugg button small{grid-column:2;color:var(--muted)}
.tsugg .all{display:block;font-weight:600;color:var(--accent-ink)}
.pad{padding:10px}
.new-btn{margin-left:auto}
.main{padding:24px 28px 96px;min-width:0;padding-right:max(28px,env(safe-area-inset-right,0px))}
.page{display:flex;flex-direction:column;gap:18px;max-width:1240px}
.page-h{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap}

/* Controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:9px 16px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);cursor:pointer;font-weight:600;font-size:.92rem;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--accent);color:var(--accent-ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)} .btn.primary:hover{background:var(--accent-hover);color:var(--on-accent)}
.btn.subtle{border-color:transparent;background:transparent} .btn.subtle:hover{background:var(--sunken);color:var(--fg)}
.btn.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{min-height:34px;padding:5px 11px;font-size:.84rem;border-radius:8px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:default;pointer-events:none}
label.btn input{display:none}
.lnk{border:0;background:none;color:var(--accent-ink);font-weight:600;cursor:pointer;padding:0}
.inp{width:100%;min-width:0;height:42px;border:1px solid var(--line-2);border-radius:10px;background:var(--surface);padding:0 12px;font-size:.95rem}
.inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.inp:disabled{background:var(--sunken);color:var(--muted)}
select.inp{padding-right:28px;cursor:pointer}
textarea.inp.ta{height:auto;min-height:90px;padding:10px 12px;resize:vertical;line-height:1.5}
textarea.inp.ta.tall{min-height:220px;font-size:.88rem}
.numin{display:inline-flex;align-items:center;border:1px solid var(--line-2);border-radius:10px;background:var(--surface);min-width:0;overflow:hidden}
.numin:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.numin .inp{border:0;box-shadow:none!important;text-align:right;font-variant-numeric:tabular-nums;padding:0 8px}
.numin i{font-style:normal;color:var(--muted);font-size:.85rem;padding:0 8px;white-space:nowrap}
.numin i:first-child{padding-right:0}
.w-auto{width:auto;max-width:100%}
.w56{width:64px}.w90{width:110px}.w110{width:130px}.w140{width:170px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.flabel{font-size:.78rem;font-weight:600;color:var(--muted)}
.fhint{font-size:.75rem;color:var(--muted)}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.form-grid.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.span2{grid-column:span 2}.span4{grid-column:1/-1}
.chk{display:flex;gap:10px;align-items:flex-start;padding:6px 0;cursor:pointer;line-height:1.4}
.chk input{width:19px;height:19px;margin-top:1px;accent-color:var(--accent);flex:none}
.chk.dis{opacity:.55;cursor:default}
.toggle{display:inline-flex;align-items:center;gap:8px;border:0;background:none;cursor:pointer;padding:4px 0;font-size:.85rem;font-weight:600;color:var(--muted)}
.toggle .knob{width:38px;height:22px;border-radius:11px;background:var(--line-2);position:relative;transition:background .15s;flex:none}
.toggle .knob::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.toggle.on{color:var(--ok)} .toggle.on .knob{background:var(--accent)} .toggle.on .knob::after{left:19px}
.toggle:disabled{opacity:.5;cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:7px 14px;cursor:pointer;font-size:.9rem;text-align:left}
.chip:hover{border-color:var(--accent)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chip .cnt{font-size:.75rem;opacity:.75;font-weight:600}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--sunken);border-radius:11px;padding:3px;gap:2px;max-width:100%}
.seg button{border:0;background:none;padding:8px 13px;border-radius:8px;cursor:pointer;font-weight:600;font-size:.86rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:.74rem;font-weight:700;border-radius:999px;padding:3px 10px;white-space:nowrap}
.badge.ok{background:var(--ok-bg);color:var(--ok)} .badge.warn{background:var(--warn-bg);color:var(--warn)} .badge.bad{background:var(--bad-bg);color:var(--bad)} .badge.info{background:var(--info-bg);color:var(--info)} .badge.neutral{background:var(--sunken);color:var(--muted)}

/* Cards and blocks */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow);min-width:0}
.card.tight{padding:14px 16px;gap:10px}
.card.flat{padding:0;gap:0}
.card-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.card-h p{margin-top:3px}
.note{display:flex;gap:10px;align-items:flex-start;padding:11px 14px;border-radius:var(--r-s);line-height:1.45;font-size:.9rem}
.note>.ic{margin-top:2px}
.note.warn{background:var(--warn-bg)} .note.warn>.ic{color:var(--warn)}
.note.info{background:var(--info-bg)} .note.info>.ic{color:var(--info)}
.note.ok{background:var(--ok-bg)} .note.ok>.ic{color:var(--ok)}
.note.bad{background:var(--bad-bg)} .note.bad>.ic{color:var(--bad)}
.note .src{margin-top:3px}
.say{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:var(--r-s);padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.say-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.say-t{font-size:1.04rem;line-height:1.6;white-space:pre-wrap}
.say.big .say-t{font-size:1.12rem}
.say-f{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.fact{display:flex;flex-direction:column;gap:3px;padding:10px 0;border-top:1px solid var(--line)} .fact:first-child{border-top:0}
.factline{display:flex;gap:10px;align-items:flex-start;padding:5px 0}
.collapse{border:1px solid var(--line);border-radius:var(--r-s);background:var(--surface)}
.collapse-h{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;padding:12px 14px;cursor:pointer;font-weight:700;text-align:left}
.collapse-h .chev{transition:transform .15s;color:var(--muted)} .collapse.open .collapse-h .chev{transform:rotate(90deg)}
.collapse-b{padding:0 16px 14px;display:flex;flex-direction:column;gap:10px}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:30px 20px;border:1px dashed var(--line-2);border-radius:var(--r);color:var(--muted)}
.empty b{color:var(--fg);font-family:var(--f-display);font-size:1.05rem}
.empty .ic{color:var(--accent)}
.list{display:flex;flex-direction:column}
.li{display:flex;justify-content:space-between;align-items:center;gap:10px;border:0;border-top:1px solid var(--line);background:none;padding:11px 4px;text-align:left;cursor:pointer;width:100%}
.li:first-child{border-top:0} .li:hover{background:var(--surface-2)}
.li>span{display:flex;flex-direction:column;min-width:0} .li small{color:var(--muted)}
.li-r{align-items:flex-end;gap:4px}
.searchbox{position:relative;display:flex;align-items:center}
.searchbox>.ic{position:absolute;left:13px;color:var(--muted)}
.searchbox .inp{padding-left:40px}
.searchbox.big .inp{height:54px;font-size:1.08rem;border-radius:14px}
.tbl-wrap{overflow-x:auto;min-width:0}
.tbl{width:100%;border-collapse:collapse;font-size:.9rem}
.tbl th{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr.off td{opacity:.5}
.tbl .r{text-align:right} .nowrap{white-space:nowrap}
.tbl.mini{font-size:.82rem;margin-top:6px} .tbl.mini td{padding:4px 6px}
.tbl.leads td{padding:10px} .tbl.leads .inp{height:36px;font-size:.85rem;min-width:150px}
.tbl tfoot td{border-bottom:0;font-weight:600}
.tbl tfoot tr.big td{font-size:1.1rem;font-weight:800;font-family:var(--f-display);border-top:2px solid var(--line-2)}
.lnk-row{border:0;background:none;text-align:left;cursor:pointer;display:flex;flex-direction:column;padding:0}
.lnk-row small{color:var(--muted)} .lnk-row:hover b{color:var(--accent-ink)}
.due{color:var(--bad);font-weight:700}
.toasts{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:100;align-items:center;pointer-events:none;width:max-content;max-width:calc(100vw - 32px)}
.toast{background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;box-shadow:var(--shadow-lg);font-size:.9rem}
.toast.bad{background:var(--bad);color:#fff}
.overlay{position:fixed;inset:0;background:rgba(6,12,9,.55);z-index:70;display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) 16px 24px;overflow:auto}
.modal{background:var(--bg);border-radius:18px;box-shadow:var(--shadow-lg);width:min(760px,100%);display:flex;flex-direction:column;max-height:calc(100vh - 48px)}
.modal.wide{width:min(1120px,100%)}
.modal-h{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.modal-b{padding:18px;overflow:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100vw);background:var(--bg);box-shadow:var(--shadow-lg);z-index:65;transform:translateX(105%);transition:transform .2s ease;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer.open{transform:none}
.drawer-h{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.drawer-b{padding:16px 18px 40px;overflow:auto;display:flex;flex-direction:column;gap:12px}
@media (prefers-reduced-motion:reduce){.drawer,.toggle .knob,.toggle .knob::after{transition:none}}

/* Dashboard */
.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.metric{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:4px;box-shadow:var(--shadow)}
.m-l{font-size:.78rem;color:var(--muted);font-weight:600} .m-v{font-family:var(--f-display);font-size:1.6rem;font-weight:800} .m-s{font-size:.75rem;color:var(--muted)}
.welcome{border-color:var(--accent);background:linear-gradient(0deg,var(--surface),var(--surface))}
.steps3{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}

/* Live call */
.live{display:flex;flex-direction:column;gap:16px;max-width:1320px}
.live-head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap}
.live-head h1{font-size:1.6rem}
.save{font-size:.78rem;color:var(--ok);font-weight:600} .save.saving{color:var(--muted)}
.stepper{list-style:none;margin:0;padding:6px;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow-x:auto}
.stepper button{width:100%;display:flex;align-items:center;gap:8px;border:0;background:none;padding:8px;border-radius:10px;cursor:pointer;text-align:left;font-size:.82rem;font-weight:600;color:var(--muted);min-width:0}
.stepper .n{width:24px;height:24px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:.78rem;border:1.5px solid var(--line-2)}
.stepper .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stepper button:hover{background:var(--surface-2)}
.stepper button.done .n{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}

",stage:"Decision-maker",do:"Ask: \u201CWill anyone else be involved in approving the design and price?\u201D If yes, invite them to participate or confirm how decisions will be made.",result:"Decision-maker recorded",row:9},{n:"05",stage:"Confirm property + design",do:"Confirm full street/city/ZIP, roofline or full-property request, color scheme, landscaping, target install date and special access concerns.",result:"Clear requested scope",row:10},{n:"06",stage:"Check aerial measurements LIVE",do:"Open approved measurement tool while on call. Trace ONLY areas the customer wants lit; distinguish roofline from peaks, porch/garage and add-ons. Verify front photos if possible.",result:"Footage / scope captured",row:11},{n:"07",stage:"Qualify quote confidence",do:"Standard, visible roofline + reliable measurements = quote on call. Unclear steep/metal roof, high access, hidden sections or uncertain lengths = estimated range pending review.",result:"Firm quote or range",row:12},{n:"08",stage:"Price by agreement",do:"Use current OWNER-APPROVED rate card; price roofline plus minis, stakes, wreaths and special access separately. Explain seasonal scope and term before presenting total.",result:"Seasonal quote ready",row:13},{n:"09",stage:"Explain agreement",do:"Explain that the standard multi-year plan allows the company to invest in custom-fit materials up front and return for subsequent seasons. Check current term and cancellation exception.",result:"Terms understood",row:14},{n:"10",stage:"Mockup + design",do:"Use the customer's property photo and one of the THREE AI prompts. Review accuracy; present it as a visual concept, not a field measurement.",result:"Design attached / shared",row:15},{n:"11",stage:"Ask for sale",do:"\u201CIf the design and total work for you, would you like us to reserve an installation date?\u201D If not, find the actual concern and use Objections tab.",result:"Accepted / objection",row:16},{n:"12",stage:"Create quote + next action",do:"If quote needed: open lead \u2192 Convert to Customer \u2192 Subscription \u2192 create/send estimate. If accepted, follow signed agreement and deposit process. Set owner and exact next step.",result:"No unowned leads",row:17}],rules:[{icon:"\u2713",case:"Simple visible house",how:"Measure live, apply verified per-foot price, give a seasonal total while on the phone.",expect:"Final subject to actual site conditions",row:21},{icon:"!",case:"Complex roof or obstructed views",how:"Give a transparent price range; request better photo or supervisor check BEFORE firm agreement.",expect:"Don't invent footage / access",row:22},{icon:"\u2713",case:"Customer wants only roofline",how:"Quote only visible installable requested roof edges. Don't price optional landscaping.",expect:"Keep quote simple",row:23},{icon:"\u2713",case:"Customer budget below proposal",how:"Offer smaller front-roofline phase or fewer add-ons; don't silently reduce agreed quality.",expect:"Revised scope, not fake discount",row:24},{icon:"!",case:"Homeowner-supplied lights",how:"We install company-provided commercial lights only; explain maintenance and custom-fit benefits.",expect:"No homeowner light installs",row:25},{icon:"\u2713",case:"Customer says yes",how:"Issue the agreement and deposit request via company process, then confirm installation scheduling.",expect:"Don't mark booked early",row:26}],facts:["Contact result","Confirmed address","Requested design/color","Budget + agreement term","Quote/status","Named owner + dated next action"],factsRow:29},script:{sheet:"02 CALL SCRIPT",title:"EMILY'S PHONE SCRIPT  |  READ NATURALLY",sub:"Copy-ready language from first hello through closing. Use the exact estimate and agreement language approved by Edge Shines.",lines:[{n:"01",when:"Opening",say:"Hi! How are you doing? This is Emily with Edge Shines Christmas Lights. I\u2019m calling about your interest in decorating your property. Is now a good time for a quick 5\u201310 minute conversation?",action:"Pause for response",row:6},{n:"02",when:"Done-for-you service",say:"What I\u2019ll do is quickly explain how our service works. It's completely done for you: we provide the lights, professionally install them, maintain them during the season, and return to take them down and store them afterward.",action:"Establish value",row:7},{n:"03",when:"Lights + price EARLY",say:"We use commercial-grade C9 LED lights that are custom-cut and spliced to fit your home. You choose the color or fixed color pattern, but they are not app-controlled color-changing lights. The average home is around $1,000 per season depending on the design. Is that somewhere around the budget you had in mind?",action:"Budget fit / expectations",row:8},{n:"04",when:"Materials policy",say:"And just so you know, we install our own professional lights rather than homeowner-supplied lights, so we're able to stand behind the fit and maintenance.",action:"No customer-supplied lights",row:9},{n:"05",when:"Decision-maker",say:"Before we start, are you the main decision-maker for the Christmas lights, or will someone else also be involved?",action:"Identify approvals",row:10},{n:"06",when:"Property and scope",say:"What's the full property address, including city and ZIP? Are you mainly thinking roofline, or would you also like bushes, trees, wreaths, garland or walkway lighting?",action:"Scope + address",row:11},{n:"07",when:"Color + timing",say:"Do you prefer classic warm white, a multicolor pattern, or something else? And about when were you hoping to have everything installed?",action:"Fixed color / timeline",row:12},{n:"08",when:"Design consultation",say:"We can pull up your home using online property images and create a customized mockup of what it could look like. We'll design around your style and budget, then adjust anything you want changed.",action:"Permission to show concept",row:13},{n:"09",when:"Measure while on call",say:"While we're talking, I'm going to check the roofline areas you want lit using our aerial measuring process. That gives us a starting point for the price without having to book a separate measurement visit.",action:"Follow measuring SOP",row:14},{n:"10",when:"Present preliminary price",say:"Based on the roofline and areas we just discussed, the seasonal price is approximately $____. That includes the company-provided lights, installation, standard in-season maintenance, removal and storage. [If measurement is verified: \u2018I can prepare the formal quote from this.\u2019]",action:"Don't call range a firm price",row:15},{n:"11",when:"Explain 3-year model",say:"Our standard 3-year option is designed so we invest in the custom-cut materials for your house the first season, then come back for the next two seasons to reinstall and take everything down. It helps us offer a competitive seasonal rate.",action:"Explain, don't pressure",row:16},{n:"12",when:"If price is too high",say:"I completely understand. We can simplify the design\u2014maybe prioritize the front roofline first\u2014and build something that fits more comfortably without compromising how neatly it's installed.",action:"Ask target budget",row:17},{n:"13",when:"Mockup reveal",say:"I have a design concept showing the lighting on your property. What do you like most about it, and is there anything you'd change?",action:"Listen before talking",row:18},{n:"14",when:"Close the sale",say:"If you love the design and the price works for you, would you like us to move forward with the agreement and get your installation scheduled?",action:"Ask directly",row:19},{n:"15",when:"When accepted",say:"Perfect! I'll confirm the details, send over your seasonal agreement and payment information, and we can reserve your spot once the required steps are completed.",action:"FLYRA customer + subscription",row:20},{n:"16",when:"If not ready",say:"No problem. Is it the design, the investment, or the agreement length you're still thinking about? Let's make sure I have the right information for you.",action:"Record genuine concern",row:21},{n:"17",when:"End call",say:"What works best for our next step\u2014reviewing the revised design, completing the agreement, or reconnecting at [specific day/time]? I'll confirm the details by text.",action:"Set exact next step",row:22}],never:["Exact final footage from an unclear satellite view","Any color not in inventory","Special installation method on a roof not inspected","Zero cancellation charges regardless of agreement","A date that has not been reserved"],neverRow:25},fast:{sheet:"03 FAST QUOTES",title:"FAST PHONE QUOTING  |  NO SEPARATE CALCULATOR",sub:"Goal: quote routine roofs on the first call. Rate card is a management reference\u2014confirm rates before reps start selling.",routine:[{n:"1",action:"Confirm address",how:"Ask for full street address, town and ZIP; match the exact house using street view/property image.",stop:"If wrong property",row:6},{n:"2",action:"Pick scope",how:"Ask: front roofline, entire accessible roofline, garages/peaks, or full-property? Only price sections they approve.",stop:"If customer unsure, offer 2 scope options",row:7},{n:"3",action:"Open measuring tool",how:"Use the company's chosen aerial roofline tool (e.g., Measured Bid or LightQuoter) or Google Earth manual tracing. Keep it open alongside FLYRA.",stop:"If no usable imagery",row:8},{n:"4",action:"Trace installable lines",how:"Trace each gutter, peak and garage edge requested. Do not include roof planes, duplicate edges or impossible/unseen sections.",stop:"If slope or access uncertain",row:9},{n:"5",action:"Check difficult conditions",how:"Check number of stories, steep peaks, metal/fragile roofs, ladder placement, big trees, outlet availability and roofline access.",stop:"High/difficult roof \u2192 review",row:10},{n:"6",action:"Price with rate card",how:"Multiply measured length by approved rate for selected term. Add minis/stakes/wreaths or special labor as separate items. Avoid undisclosed add-ons.",stop:"If rates not approved",row:11},{n:"7",action:"Quote with confidence level",how:"Reliable image + uncomplicated access: present quote now. Unreliable measurement: present labeled preliminary range and arrange verification before finalizing.",stop:"Don't guarantee risky footage",row:12},{n:"8",action:"Close and capture",how:"Recap design + seasonal total + plan. Ask to proceed; when quote needed use Convert to Customer \u2192 Subscription in FLYRA.",stop:"Customer decision + next step",row:13}],rates:[{term:"2-year",roof:"$10 / linear foot",mini:"$50 / strand",stake:"$7 / linear foot",row:17},{term:"3-year",roof:"$8 / linear foot",mini:"$50 / strand",stake:"$7 / linear foot",row:18},{term:"4-year",roof:"$7 / linear foot",mini:"$50 / strand",stake:"$6 / linear foot",row:19}],rateNote:"Reference prices from the existing Edge Shines plan; verify active package rates, minimums, add-ons, discounts, taxes, agreement terms, and promotional exceptions before quoting. This is NOT an automatic price calculator.",checkpoint:[{verify:"Measurements match design",why:"Avoid pricing 100 feet while depicting 160 feet.",action:"Compare traced sections to mockup",row:24},{verify:"Single fixed color confirmed",why:"Color must be available and not app-changeable.",action:"Confirm bulb stock or lead time",row:25},{verify:"Seasonal package scope",why:"Company provides lights; install, maintenance, removal, storage included as agreed.",action:"Say inclusions",row:26},{verify:"Material and add-on count",why:"Trees, shrubs, stakes, wreaths, garland, wiring, access surcharge if applicable.",action:"Don't bury extras",row:27},{verify:"Deposit + agreement",why:"Current policy is usually 50% deposit; terms and tax depend on agreement.",action:"Confirm current approved terms",row:28},{verify:"FIRM vs PRELIMINARY",why:"Unknown steep/high roof, imagery blocked, unsafe access or disputed measurements.",action:"Escalate before firm price",row:29}],cantVerify:"\u201CFrom the images and the design you're looking for, I expect the seasonal price to be around $___\u2013$___. I want to verify one roof section before promising a fixed price, so there aren't any surprises.\u201D"},facts:{sheet:"04 SERVICE FACTS",title:"SERVICE & PRODUCT KNOWLEDGE  |  QUICK ANSWERS",sub:"Use these facts when customers ask what they are buying. Do not substitute broad promises for the signed service agreement.",items:[{topic:"Product type",say:"Commercial-grade C9 LED Christmas lights on customized socket line. Use \u2018C9 LED\u2019 when the customer asks what type.",check:"Bulb style available in stock",row:6},{topic:"Seasonal vs permanent",say:"These are professionally installed seasonal holiday lights\u2014not permanent, phone-controlled color-changing lighting.",check:"Do not imply app control",row:7},{topic:"Colors",say:"Customers can choose from available fixed colors or fixed multi-color patterns. Black and gray are not offered.",check:"Confirm specific color availability",row:8},{topic:"Can colors change?",say:"No. The installed bulb colors remain what the customer selects. Changing colors requires replacing/reworking bulbs rather than tapping an app.",check:"Explain prior to selling",row:9},{topic:"Client supplies lights?",say:"No. Edge Shines does not install homeowner-provided light strings or bulbs.",check:"Company-supplied only",row:10},{topic:"Custom fit",say:"We measure, custom-cut and splice socket line to the home's approved roofline so there aren't stray bulbs dangling past edges.",check:"Exact installable footprint",row:11},{topic:"Spacing",say:"Typical roofline presentation uses approximately 15-inch spacing unless the approved design specifies otherwise.",check:"Confirm stock line spacing",row:12},{topic:"Roofline coverage",say:"Follow installable gutters, roof peaks, gables, garage edges and other approved lines; don't add lines where there are no secure mounting options.",check:"Access review",row:13},{topic:"Bushes and trees",say:"Mini lights can wrap approved shrubs/trees; quote by strand or project using approved material quantities.",check:"Count separately",row:14},{topic:"Ground lighting",say:"Ground stakes can border an approved driveway or walkway; quote lengths separately.",check:"Snow / plow exposure",row:15},{topic:"Wreaths / garland",say:"Available as separate custom-design add-ons when quoted and in stock.",check:"Size, lights, wiring, mount",row:16},{topic:"Mockup accuracy",say:"AI mockups illustrate a proposal; architecture must remain the same and only the selected areas should be lit.",check:"Mockup is not measurement",row:17},{topic:"In-season upkeep",say:"Standard service includes maintenance of company-installed lights during the contracted season, subject to agreement exclusions.",check:"Third-party damage exclusions",row:18},{topic:"Takedown",say:"Edge Shines returns to professionally remove the seasonal setup after the holiday period.",check:"Seasonal calendar",row:19},{topic:"Storage",say:"The company stores its lighting and materials for the next applicable season.",check:"Company owns materials",row:20},{topic:"Who owns the lights?",say:"Company-provided bulbs, wires, clips, timers and decorations remain company property unless the signed agreement expressly differs.",check:"Don't promise ownership transfer",row:21},{topic:"Timer",say:"Timers / controls may be installed as part of the service; operation depends on the specific selected product.",check:"Check schedule and sensor",row:22},{topic:"Electrical setup",say:"We need appropriate power access. Additional wiring/outlet needs may affect the plan.",check:"Do not promise new circuits",row:23},{topic:"Deposit",say:"Standard program uses a 50% deposit to reserve a season; balance is generally due upon completed installation.",check:"Check current agreement",row:24},{topic:"Agreement term",say:"The standard 3-year plan returns in years 2 and 3; 2- and 4-year options may be available at approved pricing.",check:"Confirm chosen option",row:25},{topic:"Reason for multi-year",say:"Most custom material and initial setup investment occurs in the first season, so later seasons are important for sustainable pricing.",check:"Do not claim exact losses",row:26},{topic:"Early cancellation",say:"Your typical policy uses a fee of 40% of that year's seasonal bill for applicable early cancellation, to offset custom materials. Agreement exceptions control.",check:"Confirm actual signed terms",row:27},{topic:"Competitor comparison",say:"Explain the full-service value and competitive pricing objectives, not unverified claims of being the cheapest.",check:"No unsupported ranking",row:28},{topic:"Typical home price",say:"Use around $1,000 per season as a general expectation setter\u2014not a guaranteed minimum, maximum or fixed house quote.",check:"Actual price by design",row:29},{topic:"Roof safety",say:"Use approved attachment methods based on roof/siding material. Never promise staples, glue, magnets or no damage without reviewing conditions.",check:"Escalate unusual roof materials",row:30}]},obj:{sheet:"05 OBJECTIONS",title:"OBJECTION FINDER  |  SELECT A QUESTION",sub:"Choose an objection in B4 to bring its answer to the top. Full answer bank is below; adjust terms to the customer's signed agreement.",items:[{says:"I don't want a 3-year agreement",answer:"I understand. We aim to offer competitive full-service pricing. In year one we buy the lights, custom-cut and splice everything to your home, and complete the initial setup\u2014so that first season carries most of our material costs. The later seasons are how we make the multi-year service sustainable. We return each year to install, maintain, remove and store everything.",next:"Would you like me to show what the different approved agreement lengths look like?",row:11},{says:"What if I cancel in the second year?",answer:"For agreements with our standard early-cancellation clause, the fee is 40% of that year's seasonal bill. It helps recover the cost of materials already custom-fit to your home. I can show you the exact wording before you sign; any promotional exception in your signed agreement takes precedence.",next:"Would you like me to send the specific cancellation section for review?",row:12},{says:"Why can't I do one year?",answer:"Our standard business model is based on multiple seasons because the first-year custom materials and installation are the largest investment. I can review whether a shorter option or one-time custom quote is currently approved.",next:"Should I check the options for your property?",row:13},{says:"Is $1,000 the price for my house?",answer:"That's the approximate price of an average seasonal home, not a universal quote. Your total depends on roofline footage, access, the design and any add-ons. I can measure the requested sections with you now.",next:"Is roofline-only your priority?",row:14},{says:"It's too expensive",answer:"I understand. We supply professional lights, custom-fit the lines, install, provide maintenance, then remove and store everything. We can simplify the design\u2014often starting with the front roofline\u2014to bring the total closer to your goal.",next:"What total would you be more comfortable with?",row:15},{says:"Other companies are cheaper",answer:"That may be true for a different scope. Our quote includes the custom-fit company-owned C9 lights, professional setup, seasonal upkeep, takedown and storage. Let's compare what's included rather than only the headline number.",next:"Do you know whether their quote includes removal and storage?",row:16},{says:"What kind of lights are they?",answer:"We use commercial-grade C9 LED holiday lights on custom-cut socket line, designed for a clean and uniform roofline.",next:"Would you prefer warm white or another fixed color?",row:17},{says:"Can the lights change colors?",answer:"The seasonal C9 lights we quote are fixed-color bulbs, not an app-controlled color-changing system. You can choose an approved single color or fixed multicolor layout when we design it.",next:"Which fixed look do you prefer?",row:18},{says:"What colors can I choose?",answer:"We can work with the available C9 colors and fixed patterns, other than black or gray. I'll confirm stock before promising an exact color combination.",next:"Do you want classic warm white, multicolor or a specific pattern?",row:19},{says:"Will the lights hang over my roof?",answer:"No loose extra bulbs are part of the plan. We custom-cut and splice the roofline runs to fit the approved edges and install them as neatly as the roof permits.",next:"Can we focus on the visible front edges first?",row:20},{says:"Can you hang lights I already own?",answer:"We don't install homeowner-provided lights. Using our own commercial-grade materials lets us custom-fit the layout and manage maintenance consistently.",next:"Would you like a quote for our done-for-you service?",row:21},{says:"Who owns the lights after installation?",answer:"Edge Shines retains ownership of the company-provided lights and related materials under our standard service agreement; we store them for upcoming seasons.",next:"Would you like to review the service-inclusions section?",row:22},{says:"Do you store them for me?",answer:"Yes. Seasonal removal and storage of our company-provided lighting are included in the standard full-service program.",next:"Would you like the roofline taken down at the standard seasonal time?",row:23},{says:"What if a bulb goes out?",answer:"Let us know and we'll address covered maintenance issues during the season under the agreement. Damage from third parties or equipment can have different treatment.",next:"Can I confirm the best contact number for service?",row:24},{says:"Can I get roofline only?",answer:"Absolutely. Roofline-only is a great clean design, and we can cover as much of the visible installable front roofline as you'd like within your budget.",next:"Should I include the garage and front peaks?",row:25},{says:"Can you do the trees and bushes?",answer:"Yes, we can quote minis on selected shrubs and trees as add-ons. We'll estimate the strand count separately from the roofline.",next:"Which plants do you want included?",row:26},{says:"I need to ask my spouse",answer:"Of course. I'd be happy to send the design and price so you're both looking at the same option, then we can answer any questions together.",next:"When would both of you be available for five minutes?",row:27},{says:"I need to think about it",answer:"Absolutely. Is the main thing you're considering the total price, how the design looks, or the agreement length? I want to send you the information that's actually useful.",next:"What would help you decide?",row:28},{says:"Just send me pricing",answer:"Happy to. The accurate way is to confirm the property, the sections you'd like lit, and the seasonal agreement. I can often get you a number while we're speaking.",next:"What's the full address?",row:29},{says:"I don't have time right now",answer:"No problem. We only need a few minutes for the consultation. Let's choose a time that works so we can discuss exactly what you want.",next:"Would later today or tomorrow be better?",row:30},{says:"Can you guarantee the exact mockup?",answer:"The mockup shows the intended design, but actual lighting will follow installable roof edges and real conditions. We review it for accuracy before finalizing.",next:"Which elements of the concept matter most to you?",row:31},{says:"Is this permanent lighting?",answer:"No, it's professional seasonal Christmas lighting. We install it, provide agreed maintenance, then remove and store the lighting.",next:"Are you looking specifically for seasonal decorating?",row:32},{says:"My roof is metal or aluminum",answer:"We'd review the roof and approved attachment options before committing to a mounting method. We won't assume that magnets, glue, clips or staples are suitable.",next:"Could you share a close-up photo of the roof edge?",row:33},{says:"Can you install this week?",answer:"We'd love to help. I can check available installation dates once we confirm the scope and paperwork, but I don't want to promise a date that isn't reserved.",next:"What is your ideal installation date?",row:34},{says:"Does the price include removal?",answer:"Yes. Our standard full-service seasonal pricing includes installation, covered maintenance, removal and storage of our company-owned lighting.",next:"Do you want me to show the full inclusions on the quote?",row:35},{says:"Can we change the design next year?",answer:"We can discuss changes, though a multi-year price is built around the original custom-fitted design. New areas, colors or major revisions may require a revised quote.",next:"What kind of change are you considering?",row:36},{says:"Are there cancellation fee exceptions?",answer:"Some promotions may offer different terms. The only terms I can promise are those in your specific signed agreement; I'll check them before answering conclusively.",next:"Can I review the agreement you're being offered?",row:37},{says:"Why is a deposit needed?",answer:"We reserve labor and prepare custom-fit materials for your property. Our standard program uses a 50% deposit, with the balance generally due upon completed installation.",next:"Would you like me to send the agreement and payment steps?",row:38}],policy:"POLICY NOTE  \u2022  Check signed cancellation terms, promotional exceptions, current rates and inventory; do not guarantee costs, dates or materials without verification."},mock:{sheet:"06 AI MOCKUPS",title:"AI MOCKUP SOP  |  ONLY 3 PROMPTS",sub:"Attach a clear image of the customer's actual property. Copy the entire prompt from the appropriate cell; do not invent the building or lighting locations.",steps:[{step:"1  Select photo",do:"Use the best clear front/street-facing home photo from the customer, Maps, Zillow or another legitimate property view. Check that it is the right property.",rule:"Clear front roofline",row:6},{step:"2  Choose 1 of 3 prompts",do:"Whole-property concept, maximum front roofline, or a specific revision. Replace bracketed items like [COLOR] before pasting.",rule:"No extra prompts needed",row:7},{step:"3  Submit photo + prompt",do:"Upload the property photo to the image AI and paste the selected template verbatim. If the tool supports marking exact edges, mark them first.",rule:"Use source photo",row:8},{step:"4  Verify before sending",do:"Compare original and result. Check roof edges, missing/extra lights, door/window changes, landscaping, bulb spacing, floating lines and unrealistic installation.",rule:"Reject inaccurate mockups",row:9},{step:"5  Explain to customer",do:"\u201CHere's a design concept for your home. We\u2019ll verify the actual installation areas and measurements before treating it as the final scope.\u201D",rule:"Not a measuring tool",row:10}],prompts:[{label:`PROMPT 1
BEST POSSIBLE DESIGN`,text:"Edit the ATTACHED PHOTO of this exact property. Create the most attractive, high-impact, professionally installable Christmas lighting design realistically possible for the visible property. Use commercial-grade C9 LED holiday lights with a fixed [COLOR OR COLOR PATTERN] color scheme and visually even approximately 15-inch spacing on all suitable visible front gutters, front-facing roof peaks, gables, garage roof edges and connecting installable rooflines. Make the light runs neatly custom-cut and spliced to fit: no bulbs hanging beyond roof edges, floating bulbs or sagging lines. Add complementary mini lights on suitable front bushes and trees, and tasteful wreaths or garland ONLY where physically plausible, balanced and consistent with a premium full-property proposal. Do not invent architectural surfaces, unsafe mounting points, new windows, doors, bushes or trees. Change the scene to realistic nighttime with natural LED glow. Preserve the property's exact architecture, landscaping and camera angle. If a feature is unclear or inaccessible, leave it unlit rather than guessing.",use:`Full-property concept
Show premium options`,row:14},{label:`PROMPT 2
MAX ROOFLINE ONLY`,text:"Edit the ATTACHED PHOTO of this exact property. Install as MANY fixed [COLOR OR COLOR PATTERN] commercial-grade C9 LED Christmas lights as realistically possible on the VISIBLE, INSTALLABLE FRONT ROOFLINE ONLY. Follow every suitable front gutter, front-facing roof peak, gable, garage roof edge and connecting roofline to create maximum roofline coverage. Use visually even approximately 15-inch spacing. Custom-cut and splice the runs to fit precisely: NO extra bulbs hanging past roof edges, floating bulbs, or sagging lines. DO NOT add lights on siding, around windows or doors, bushes, trees, walkways, pillars, wreaths or garland. Make it nighttime with realistic glow. Preserve every architectural feature, landscaping element and the camera angle exactly as photographed. If a section is unclear or physically inaccessible, leave it out rather than inventing a surface.",use:`Roofline-only quote
No landscaping`,row:15},{label:`PROMPT 3
REVISE EXISTING MOCKUP`,text:"Edit the ATTACHED CHRISTMAS LIGHT MOCKUP of this exact property. Make ONLY the following specific changes: [DESCRIBE EXACT CHANGES, e.g., remove lights from left bushes; add one 24-inch warm-white wreath with red bow over center window; keep roofline lights unchanged]. Follow any user-marked red lines or circles exactly. Preserve every existing light and decoration NOT explicitly mentioned, including current color, spacing, placement and glow. Do not add any new lights or decorations outside the requested changes. Keep the architecture, landscaping, perspective and nighttime lighting exactly the same. Make all remaining light runs neat, correctly attached and realistic. If a requested surface is unclear or physically inaccessible, leave it unchanged instead of inventing one.",use:`Changes only
No redesign`,row:16}],final:"FINAL CHECK  \u2022  Does the AI design match the customer's measured scope, fixed-color selection and the home's actual roofline? If not, correct it before sending."},flyra:{sheet:"07 FLYRA SOP",title:"FLYRA SOP  |  LEAD \u2192 CUSTOMER \u2192 SUBSCRIPTION",sub:"This is the Edge Shines internal workflow requested for FLYRA. Use the equivalent current menu labels if the interface changes.",steps:[{n:"01",action:"Open original lead",detail:"Search by customer name or number; review latest call/text notes; don't create a duplicate.",result:"Existing record",row:6},{n:"02",action:"Confirm customer fields",detail:"Full name, phone, email if available, address including city/ZIP, property notes, source, decision-maker.",result:"Complete profile",row:7},{n:"03",action:"Document scope",detail:"Roofline sections, footage and reliability, C9 colors, add-ons, design image, agreement option and anticipated installation date.",result:"Ready to quote",row:8},{n:"04",action:"CLICK: CONVERT TO CUSTOMER",detail:"When a quote is required, click Convert to Customer on the lead record.",result:"Customer created",row:9},{n:"05",action:"CHOOSE: SUBSCRIPTION",detail:"In the conversion workflow, choose Subscription for the recurring seasonal Christmas lighting service.",result:"Subscription path",row:10},{n:"06",action:"Verify conversion",detail:"Confirm correct customer, property, plan length, season price and subscription details; check for duplicates.",result:"Correct records",row:11},{n:"07",action:"Create estimate / quote",detail:"Line-item approved roofline and add-ons, attach mockup if supported, review price, service inclusions and applicable taxes.",result:"Draft quote",row:12},{n:"08",action:"Send + present",detail:"Send approved quote to customer, explain plan, color, scope, seasonal services and what happens next.",result:"Quote sent",row:13},{n:"09",action:"Update lead stage / record",detail:"Use the appropriate current FLYRA status for design/quote sent or negotiating; record date and quoted amount.",result:"Trackable stage",row:14},{n:"10",action:"Set next action",detail:"Assign named owner, exact next date/time, specific contact method and customer question to answer. Send recap text as needed.",result:"No unowned opportunity",row:15},{n:"11",action:"When accepted",detail:"Send company-approved agreement and deposit request; verify signature/payment before confirming installation.",result:"Agreement + payment",row:16},{n:"12",action:"Confirm install booking",detail:"After prerequisites are met, confirm agreed installation window in the scheduling system and notify customer.",result:"Reserved installation",row:17}],notes:["Address & photos","Decision-maker","Fixed color / design areas","Exact or estimated footage","Approved price & term","Objections","Quote sent","Next action + owner"],pipeline:{before:"New Lead \u2192 Contact Attempted",during:"Qualified \u2192 Design/Estimate Sent \u2192 Negotiating",after:"Won after required approvals/payment; otherwise Lost + reason",rbefore:"Always log attempt + time",rduring:"Never leave quote without next action",rafter:"Don't mark booked without actual date confirmation"}},texts:{sheet:"08 TEXT TEMPLATES",title:"CUSTOMER TEXT TEMPLATES  |  COPY + PERSONALIZE",sub:"Keep messages short, conversational, and specific. Replace bracketed text. Send through FLYRA so contact history stays in one place.",items:[{situation:"New inquiry / missed call",text:"Hi [NAME]! This is Emily with Edge Shines Christmas Lights. Thanks for reaching out! We provide the lights, custom design, installation, seasonal maintenance, takedown and storage. Do you have about 5\u201310 minutes today to go over a design for your home?",when:"Send after initial missed call",row:6},{situation:"Need full property address",text:"Hi [NAME]! To create an accurate lighting design and estimate, could you send the complete property address, including city and ZIP code? Thank you!",when:"Before aerial look-up",row:7},{situation:"Budget qualification",text:"Hi [NAME]! As a starting point, an average seasonal home is around $1,000, depending on the design and amount of lighting. Is there a budget you'd prefer we design around?",when:"Before design investment",row:8},{situation:"Mockup ready",text:"Hi [NAME]! We put together a Christmas lighting concept for your home. Take a look and let me know what you love or what you\u2019d like us to adjust. Once we confirm the design, I can walk you through the seasonal price.",when:"Send with photo",row:9},{situation:"Quote sent",text:"Hi [NAME]! I just sent your Edge Shines Christmas lighting estimate for [SCOPE]. It includes company-provided lighting, installation, standard maintenance, takedown and storage. Let me know what questions you have, and we can review the next steps together.",when:"Record sent date",row:10},{situation:"Option to lower budget",text:"Hi [NAME]! If you\u2019d like, I can revise the design to focus on the front roofline and keep the neat custom-fit look while bringing the price closer to [BUDGET]. Would you like me to try that version?",when:"Create approved revision",row:11},{situation:"Need another decision-maker",text:"Hi [NAME]! I sent the design and estimate so you and [OTHER PERSON] can review them together. Would a quick call [DAY/TIME] work to answer questions and make any changes?",when:"Book a real call",row:12},{situation:"Agreement question",text:"Hi [NAME]! Our standard multi-year plan lets us custom-fit the materials in year one and handle the seasonal service again in future years. I'm happy to go over the exact term and cancellation language before you decide.",when:"Do not improvise fee terms",row:13},{situation:"Ready to proceed",text:"Hi [NAME]! We\u2019d love to decorate your home! The next step is reviewing and signing the agreement and taking care of the required deposit. Once everything is confirmed, we can finalize your installation scheduling.",when:"Only after customer agrees",row:14},{situation:"Follow-up with specific choice",text:"Hi [NAME]! Just checking in on your Christmas light design. Would you prefer we keep the current layout at [PRICE] or prepare the simpler [ALTERNATIVE] version? Happy to help either way!",when:"Set follow-up task",row:15},{situation:"Home not visible in maps",text:"Hi [NAME]! The street imagery isn't giving us a clear enough view of your roofline to quote accurately. Could you send a straight-on daytime photo of the front of your home? That should help us finish your estimate.",when:"Don't guess measurement",row:16}],standards:["Use the customer's real name","Confirm exact price and season before sending","Don't state a date is booked without confirmation","Record the conversation and specific next action in FLYRA"]},measure:{sheet:"09 MEASURE SOP",title:"MEASURE EVERY AREA \xB7 PHONE ESTIMATING SOP",sub:"Use this flow during the first call. Match approved scope to real measurements. AI designs are visual only\u2014not measuring tools.",steps:[{n:"01",area:"Start with exact property",measure:"Confirm street address, town, ZIP; open aerial/street imagery and confirm the right house.",rule:"Ask whether front only, full roofline, or roofline plus add-ons.",row:4},{n:"02",area:"ROOFLINE \xB7 C9",measure:"Trace each approved gutter, gable, garage front, dormer and other installable edge in feet. Add segments once only.",rule:"Satellite lengths may miss sloped rake length; check pitch/second-story access. Flag steep/hidden roof.",row:5},{n:"03",area:"BUSHES \xB7 minis",measure:"Count individual shrubs; note size, height and desired coverage (front/sides/full wrap). Estimate strands per shrub.",rule:"Working starting point: ~5 strands per typical bush; actual count varies by size and strand length.",row:6},{n:"04",area:"TREES \xB7 minis",measure:"Count trees, approx. height, trunk/branch coverage, or canopy wrap; estimate strands by requested coverage.",rule:"Working starting point: ~10 strands per moderate tree. Large/ nal installation of a 48-inch premium illuminated Christmas wreath featuring warm white LED lights. Designed to create an elegant holiday display on large homes, entryways, and prominent exterior features. Includes secure mounting, electrical connections, timer integration, in-season maintenance, removal, and storage. All materials remain the property of Edge Shines Home Services."},{key:"w60",name:"60 Inch Lit Wreath",price:500,unit:"each",description:"Premium 60-inch commercial-grade holiday wreath featuring warm white LED mini lights and a decorative red bow. Includes professional installation, secure mounting, timer setup, in-season maintenance, removal, and seasonal storage. All materials remain the property of Edge Shines Home Services."}],plan:{name:"Annual Holiday Light Service Plan - 3 Years",termMonths:36,lines:[{title:"Holiday Lights",price:6},{title:"Mini Lights",price:30},{title:"Ground Stake Lighting",price:6}],taxes:[{name:"Sales Tax",rate:8.375},{name:"Credit card processing fee",rate:3.4}],terms:`AGREEMENT TERM: This agreement covers three consecutive holiday seasons. By signing or electronically accepting this agreement, the Customer agrees to the full three-year term.

DECORATIONS & WORK: Wreaths, garland, specialty decorations, difficult-access areas, tall rooflines, and other additional work are not included in the standard per-foot or per-strand pricing unless specifically listed on the approved estimate.

PAYMENT: A 50% payment is required to reserve installation each season. The remaining balance is due upon completion of the installation.

WHAT YOUR SEASONAL PRICE INCLUDES: Seasonal pricing includes professional installation, company-provided lighting and standard materials, timer setup, in-season maintenance, removal, and storage.

OWNERSHIP OF MATERIALS: All company-provided lights, cords, clips, timers, and decorations remain the property of Edge Shines Home Services. The Customer may not remove, relocate, modify, or allow another company or individual to handle company-owned materials without permission.

COLOR & DESIGN: The approved lighting colors and design are locked in for all three seasons. If the Customer requests a change to the color or color pattern, updated pricing may apply and a new three-year agreement will begin.

SCHEDULING: Installation, maintenance, and removal dates are subject to weather, safety conditions, property access, and seasonal scheduling. Exact dates are not guaranteed unless specifically agreed to in writing.

CUSTOMER RESPONSIBILITIES: The Customer is responsible for providing safe and reasonable access to the property, functioning GFCI-protected outdoor outlets, and any required HOA, landlord, or property-owner approvals.

PROPERTY CONDITIONS: Edge Shines Home Services is not responsible for pre-existing, concealed, loose, deteriorated, brittle, improperly installed, or defective components of the property.

CANCELLATION / EARLY TERMINATION: Edge Shines Home Services does not charge a cancellation or early-termination fee. If the Customer chooses to cancel the agreement early, after any cancellation period required by applicable law, the Customer will only be responsible for the material costs associated with the job, calculated as 40% of the total contracted job price for that year. Any services already completed must be paid in full.

CANCELLATION PERIOD: The Customer may cancel within three business days after signing when required by applicable law. The early-termination provision does not apply during a legally required cancellation period or if Edge Shines Home Services materially breaches the agreement.

AUTOMATIC RENEWAL: After the initial three-year term, the agreement automatically renews for additional three-year terms unless the Customer cancels at least 30 days before the end of the current term. Edge Shines Home Services will provide any renewal notices, pricing information, cancellation deadlines, and cancellation instructions required by applicable law.

RENEWAL PRICING: Renewal will remain at the existing price unless the Customer affirmatively agrees to a price increase where required by applicable law.

PROFESSIONAL INSTALLATION GUARANTEE: Your lighting will be professionally installed using appropriate materials and installation methods for the approved design, subject to safe access and the condition of the property.

REMOVAL & STORAGE GUARANTEE: At the end of each holiday season, Edge Shines Home Services will remove and store the company-owned lighting and standard materials included in your agreement for the following season.
